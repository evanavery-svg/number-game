    .vit-row.taken .vit-name { color: var(--muted); }
    .vit-time { font-size: 12px; color: var(--faint); }
    .vit-row.taken .vit-time { color: var(--safe); opacity: .7; }
    .vit-undo {
      background: none; border: none; color: var(--faint); font-size: 13px; line-height: 1;
      padding: 6px; cursor: pointer; font-family: inherit; opacity: 0; transition: opacity var(--dur-base) ease;
    }
    .vit-row.taken .vit-undo { opacity: .5; }
    .vit-row.taken .vit-undo:active { opacity: 1; color: var(--accent); }
    .vit-edit-btn {
      background: none; border: none; color: var(--faint); font-size: 14px; line-height: 1;
      padding: 6px; cursor: pointer; font-family: inherit;
    }
    .vit-edit-btn:active { color: var(--accent); }
    .vit-add-row { display: flex; gap: var(--sp-2); padding-top: var(--sp-3); }
    .vit-add-row input { flex: 1; }
    .vit-add-btn {
      padding: 10px 18px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .vit-add-btn:active { opacity: .8; }
    .vit-footer { display: flex; justify-content: space-between; align-items: center; margin-top: var(--sp-3); }

    .plan-recall {
      background: var(--surface-2); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: var(--sp-3); margin-top: var(--sp-3);
      font-size: var(--fs-small); color: var(--text);
    }
    .cal-legend { display: flex; gap: 14px; margin-top: var(--sp-3); font-size: 11px; color: var(--muted); }
    .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

    .wk { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
    .wk-bar { flex: 1; background: var(--surface-2); border-radius: 4px 4px 2px 2px; min-height: 3px; cursor: pointer; transition: height var(--dur-slow) var(--ease-out); }
    .wk-bar.peak { background: linear-gradient(180deg, #ff6b5e, var(--over)); }
    .wk-bar.sel { outline: 2px solid var(--text); outline-offset: 1px; }
    .wk-labels { display: flex; gap: 6px; margin-top: 7px; }
    .wk-labels span { flex: 1; text-align: center; font-size: 10px; font-weight: 600; color: var(--faint); }
    .wk-callout { font-size: 13px; color: var(--muted); margin-top: var(--sp-3); }
    .wk-callout b { color: var(--text); font-weight: 700; }

    /* ---- time-of-day chart (insights) ---- */
    .tod { display: flex; align-items: flex-end; gap: 2px; height: 64px; }
    .tod-bar { flex: 1; background: var(--surface-2); border-radius: 3px 3px 1px 1px; min-height: 2px; cursor: pointer; transition: height var(--dur-slow) var(--ease-out); }
    .tod-bar.sel { outline: 2px solid var(--text); outline-offset: 1px; }
    .tod-bar.peak { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
    .tod-labels { display: flex; justify-content: space-between; margin-top: 7px; }
    .tod-labels span { font-size: 10px; font-weight: 600; color: var(--faint); }

    /* ---- app lock ---- */
    .lock {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + var(--sp-6));
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .lock-inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
    .lock-ring { filter: drop-shadow(0 0 12px rgba(255,149,0,0.55)); margin-bottom: 24px; }
    .lock-title { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
    .lock-dots { display: flex; gap: var(--sp-5); margin-top: 30px; }
    .lock-dots i {
      width: 13px; height: 13px; border-radius: 50%; background: transparent;
      border: 1.5px solid var(--faint);
      transition: transform var(--dur-base) var(--ease-out), background var(--dur-base) ease, border-color var(--dur-base) ease;
    }
    .lock-dots i.on { background: var(--accent); border-color: var(--accent); transform: scale(1.18); }
    .lock-error { min-height: 18px; color: var(--over); font-size: 13px; font-weight: 600; margin-top: var(--sp-4); letter-spacing: 0.1px; }
    .lock.shake .lock-dots { animation: nudge .42s ease; }

    .lock-pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 20px 26px; margin-top: 26px; touch-action: none; }
    .lock-key {
      height: 76px; width: 76px; border-radius: 50%; border: none; outline: none;
      background: var(--key); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      transition: background var(--dur-fast) ease, transform var(--dur-fast) ease;
    }
    .lock-key .num { font-size: 31px; font-weight: 400; line-height: 1; letter-spacing: 0.5px; }
    .lock-key .abc { font-size: 9px; font-weight: 700; letter-spacing: 1.6px; color: var(--muted); height: 10px; margin-top: 3px; }
    /* pressed state is driven only by JS (.pressed) — iOS :active can stick */
    .lock-key.pressed { background: var(--key-press); transform: scale(0.92); }
    .lock-key.fn {
      background: transparent; font-size: 15px; font-weight: 600; color: var(--accent);
    }

  </style>
  <script>

      </div>
      <div class="panel-body">
        <div id="sinceList"></div>
        <button class="sheet-btn primary" id="sinceAdd" style="margin-top:6px">+ New tracker</button>
      </div>
    </div>
  </div>

  <!-- Water: a separate daily hydration counter (auto-resets each day) -->
  <div class="panel-overlay" id="waterOverlay">
    <div class="panel">
      <div class="panel-head">
        <h3>Water</h3>
        <button class="panel-close" id="waterClose">Done</button>
      </div>
      <div class="panel-body" id="waterBody"></div>
    </div>
  </div>

  <!-- Growth tree: grows on under-goal days, prestiges after a month, droops on a miss -->
  <div class="panel-overlay" id="treeOverlay">
    <div class="panel">
      <div class="panel-head">
        <h3>Your Tree</h3>
        <button class="panel-close" id="treeClose">Done</button>
      </div>
      <div class="panel-body" id="treeBody"></div>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
