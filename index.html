<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="&#160;" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>&#160;</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --hair: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #8e8e93;
      --faint: #5a5a5e;
      --accent: #ff9500;
      --accent-dim: #b36800;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      overscroll-behavior: none;
    }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      max-width: 480px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 4px;
    }
    .header-title .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .header-title .date {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-top: 1px;
    }
    .gear {
      background: none; border: none;
      color: var(--muted); font-size: 22px;
      cursor: pointer; padding: 8px; margin-right: -8px;
    }
    .total { text-align: center; padding: 8px 0 2px; }
    .ring-wrap {
      position: relative;
      width: 270px; max-width: 74vw;
      margin: 4px auto 0;
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: var(--surface-2); stroke-width: 6; }
    .ring-prog { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .45s ease; }
    .ring-center { display: flex; align-items: center; justify-content: center; }
    .total .value {
      font-size: 68px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }
    .total .value.reached { color: var(--accent); }
    .total .value.bump { animation: bump .18s ease; }
    @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .ring-wrap.celebrate { animation: celebrate .65s ease; }
    @keyframes celebrate {
      0% { transform: scale(1); } 25% { transform: scale(1.05); }
      50% { transform: scale(0.99); } 75% { transform: scale(1.03); } 100% { transform: scale(1); }
    }
    .total .meta { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 18px; }
    .goal-label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; letter-spacing: 0.2px; min-height: 14px; }
    .goal-label.reached { color: var(--accent); }
    .quote {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      padding: 22px 8px 18px;
      min-height: 20px;
    }
    .add-btn {
      flex: 1;
      min-height: 150px;
      margin: 2px 0 16px;
      border: none;
      border-radius: 26px;
      background: var(--accent);
      color: #000000;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.05s ease, opacity 0.1s ease;
      user-select: none;
    }
    .add-btn:active { transform: scale(0.985); opacity: 0.9; }
    .add-btn small { display: block; font-size: 14px; font-weight: 500; opacity: 0.55; margin-top: 8px; }
    .row { display: flex; gap: 12px; margin-bottom: 18px; }
    .row button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.06s ease;
    }
    .row button:active { background: var(--surface-2); transform: scale(0.98); }
    .row button:disabled { opacity: 0.3; }
    .row .end { color: var(--accent); }
    /* chart */
    .chart-card { background: var(--surface); border-radius: 20px; padding: 16px 16px 12px; margin-bottom: 14px; }
    .section-title {
      font-size: 13px; font-weight: 600; letter-spacing: 0.2px;
      color: var(--muted); margin: 0 2px 10px;
    }
    .chart-stats {
      display: flex; flex-wrap: wrap; gap: 4px 18px;
      font-size: 13px; color: var(--muted);
      margin: 0 2px 14px;
    }
    .chart-stats b { color: var(--text); font-weight: 600; }
    .chart { display: flex; align-items: flex-end; gap: 5px; height: 80px; }
    .bar { flex: 1; min-width: 5px; background: var(--surface-2); border-radius: 3px; min-height: 3px; }
    .bar.today { background: var(--accent); }
    .chart-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 8px; }
    .history { background: var(--surface); border-radius: 20px; padding: 4px 0; margin-bottom: 16px; max-height: 42vh; overflow-y: auto; }
    .history .section-title { margin: 14px 18px 4px; }
    .hist-row { padding: 13px 18px; border-top: 1px solid var(--hair); cursor: pointer; transition: background 0.15s ease; }
    .hist-row:first-of-type { border-top: none; }
    .hist-row:active { background: var(--surface-2); }
    .hist-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; }
    .hist-top .date { color: var(--text); }
    .hist-top .amt { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
    .hist-note { font-size: 13px; color: var(--faint); margin-top: 4px; line-height: 1.35; }
    .hist-empty { padding: 20px; color: var(--faint); font-size: 14px; text-align: center; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2); color: var(--text);
      padding: 13px 22px; border-radius: 999px; font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 30; max-width: 88%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* bottom sheet */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: flex-end; justify-content: center; z-index: 20;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
      box-shadow: 0 -12px 44px rgba(0,0,0,0.6);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .overlay.show .sheet { transform: translateY(0); }
    .sheet h3 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .sheet p.sub { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
    .sheet input, .sheet textarea {
      width: 100%; padding: 14px; font-size: 17px;
      border-radius: 12px; border: 1px solid var(--surface-2);
      background: var(--bg); color: var(--text);
      font-family: inherit; font-variant-numeric: tabular-nums;
    }
    .sheet textarea { resize: none; font-variant-numeric: normal; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
    .toggle-row span { font-size: 16px; }
    .switch { position: relative; width: 52px; height: 31px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--surface-2); border-radius: 999px; transition: 0.2s; }
    .slider:before { content: ""; position: absolute; height: 27px; width: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(21px); }
    .sheet-btn {
      display: block; width: 100%; padding: 16px; margin-top: 12px;
      border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
      background: var(--surface-2); color: var(--text);
    }
    .sheet-btn.primary { background: var(--accent); color: #000; }
    .sheet-btn.ghost { background: transparent; color: var(--muted); }
    .sheet-btn.link { background: transparent; color: var(--accent); margin-top: 6px; }
    .sheet-divider { height: 1px; background: var(--hair); margin: 18px 0 2px; border: none; }
    .gear { transition: opacity 0.15s ease; }
    .gear:active { opacity: 0.5; }
    /* Respect the OS "Reduce Motion" setting */
    @media (prefers-reduced-motion: reduce) {
      .total .value.bump, .ring-wrap.celebrate { animation: none; }
      .ring-prog, .goal-fill, .sheet, .overlay { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <div class="eyebrow">Today</div>
      <div class="date" id="dateLabel"></div>
    </div>
    <button class="gear" id="gearBtn" aria-label="Settings">⚙</button>
  </header>

  <div class="total" id="totalWrap">
    <div class="ring-wrap" id="ringWrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="54"></circle>
        <circle class="ring-prog" id="ringProg" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="ring-center"><span class="value" id="total">0</span></div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="goal-label" id="goalText"></div>
  </div>

  <div class="quote" id="quote"></div>

  <button class="add-btn" id="addBtn">
    + 0.50
    <small>tap to add</small>
  </button>

  <div class="row">
    <button id="undoBtn" disabled>Undo</button>
    <button class="end" id="endBtn">End Day</button>
  </div>

  <div class="chart-card" id="chartCard" style="display:none">
    <div class="section-title" id="chartTitle">Last days</div>
    <div class="chart-stats" id="chartStats"></div>
    <div class="chart" id="chart"></div>
    <div class="chart-axis"><span id="chartFrom"></span><span>Today</span></div>
  </div>

  <div class="history" id="history">
    <div class="section-title">History</div>
    <div class="hist-empty" id="histEmpty">No previous days yet.</div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
