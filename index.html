<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="&#160;" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>&#160;</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --hair: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #8e8e93;
      --faint: #5a5a5e;
      --accent: #ff9500;
      --accent-2: #ffb340;
      --safe: #30d158;   /* comfortably under the goal */
      --warn: #ff9f0a;   /* getting close to the goal */
      --over: #ff453a;   /* over the goal */
      --card-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 14px 34px rgba(0,0,0,0.38);
      --btn-glow: rgba(255,149,0,0.38);
      --btn-text: #1a1300;   /* text on the accent button */
      --key: rgba(255,255,255,0.10);
      --key-press: rgba(255,255,255,0.22);
      --water: #0a84ff;
      --water-2: #64b5ff;
      /* soft, muted ramp for the big number as it nears the goal */
      --num-lo: #7cc6a2;   /* soft sage green */
      --num-mid: #f0a85a;  /* warm amber, close to the accent */
      --num-hi: #e2726a;   /* muted coral, not a harsh red */
    }
    /* Follow the phone's appearance: light mode gets a light skin. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --surface: #ffffff;
        --surface-2: #e9e9ee;
        --hair: rgba(0,0,0,0.07);
        --text: #1c1c1e;
        --muted: #8e8e93;
        --faint: #b0b0b5;
        --accent: #ff9500;
        --accent-2: #ffb340;
        --safe: #34c759;
        --warn: #ff9500;
        --over: #ff3b30;
        --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 26px rgba(0,0,0,0.07);
        --btn-glow: rgba(255,149,0,0.30);
        --btn-text: #1a1300;
        --key: rgba(0,0,0,0.05);
        --key-press: rgba(0,0,0,0.12);
        --water: #007aff;
        --water-2: #4da3ff;
        /* slightly deeper on a light background so they stay legible */
        --num-lo: #3f9f74;
        --num-mid: #d88a35;
        --num-hi: #cf5f56;
      }
    }
    /* Optional blue theme (Settings toggle). Overrides both light and dark,
       driven by the palette #296DBE / #1F3238 / #BABCAD. */
    :root[data-theme="blue"] {
      --bg: #1f3238;
      --surface: #26404a;
      --surface-2: #314c56;
      --hair: rgba(255,255,255,0.09);
      --text: #eceee6;
      --muted: #babcad;
      --faint: #7e8b84;
      --accent: #296dbe;
      --accent-2: #4c8fdd;
      --safe: #4cc38a;
      --warn: #f0a85a;
      --over: #e2726a;
      --card-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 14px 34px rgba(0,0,0,0.45);
      --btn-glow: rgba(41,109,190,0.42);
      --btn-text: #ffffff;
      --key: rgba(255,255,255,0.10);
      --key-press: rgba(255,255,255,0.24);
      --water: #3f9ad6;
      --water-2: #74bff0;
      --num-lo: #8fc9b4;
      --num-mid: #7fb0e6;
      --num-hi: #e2726a;
    }
    /* Recolour the SVG ring's default gradient to the theme blue */
    :root[data-theme="blue"] #gradAccent stop:nth-child(1) { stop-color: #4c8fdd; }
    :root[data-theme="blue"] #gradAccent stop:nth-child(2) { stop-color: #296dbe; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      max-width: 480px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 4px;
    }
    .header-title .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .header-title .date {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-top: 2px;
    }
    .header-actions { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
    .iconbtn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 8px; display: flex; align-items: center;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .iconbtn:active { opacity: 0.5; transform: scale(0.88); }
    .gear {
      background: none; border: none;
      color: var(--muted); font-size: 22px;
      cursor: pointer; padding: 8px;
      transition: opacity 0.15s ease, transform 0.25s ease;
    }
    .gear:active { opacity: 0.5; transform: rotate(45deg); }

    /* ---- ring / today ---- */
    .total { text-align: center; padding: 10px 0 2px; }
    .ring-wrap {
      position: relative;
      width: 282px; max-width: 76vw;
      margin: 6px auto 0;
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    /* soft coloured aura behind the ring, tinted by the current zone */
    .ring-wrap::before {
      content: "";
      position: absolute; inset: 5%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, var(--halo, transparent) 0%, transparent 68%);
      opacity: 0;
      transition: opacity 0.55s ease, background 0.4s ease;
    }
    .total.has-goal .ring-wrap::before { opacity: 1; }
    .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
    .ring-track { fill: none; stroke: var(--surface-2); stroke-width: 7; }
    .ring-prog {
      fill: none; stroke: url(#gradAccent); stroke-width: 7; stroke-linecap: round;
      transition: stroke-dashoffset 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ring-center { display: flex; align-items: center; justify-content: center; }
    .total .value {
      font-size: 72px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -2.5px;
      font-variant-numeric: tabular-nums;
      transition: color 0.35s ease;
    }
    .total .value.bump { animation: bump .18s ease; }
    @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 100% { transform: scale(1); } }

    /* Goal is a ceiling: ring, halo + number shift colour as you near and pass it. */
    .total.zone-safe { --halo: rgba(48,209,88,0.20); }
    .total.zone-warn { --halo: rgba(255,159,10,0.22); }
    .total.zone-over { --halo: rgba(255,69,58,0.24); }
    .total.zone-safe .ring-prog { stroke: url(#gradSafe); filter: drop-shadow(0 0 6px rgba(48,209,88,0.45)); }
    .total.zone-warn .ring-prog { stroke: url(#gradWarn); filter: drop-shadow(0 0 6px rgba(255,159,10,0.45)); }
    .total.zone-over .ring-prog { stroke: url(#gradOver); filter: drop-shadow(0 0 7px rgba(255,69,58,0.50)); }
    /* number colour is set in JS (white→green→orange→red toward the goal); labels keep the zone tint */
    .total.zone-warn .goal-label { color: var(--warn); }
    .total.zone-over .goal-label { color: var(--over); }

    .ring-wrap.nudge { animation: nudge .42s ease; }
    @keyframes nudge {
      0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    .ring-wrap.pulse { animation: pulse .6s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.045); } 100% { transform: scale(1); } }

    .total .meta { margin-top: 16px; font-size: 14px; font-weight: 500; color: var(--muted); min-height: 18px; transition: color 0.35s ease; }
    .total .meta.streak { color: var(--safe); }
    .goal-label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; letter-spacing: 0.2px; min-height: 14px; transition: color 0.35s ease; }
    .goal-label.hint { color: var(--accent); }

    .quote {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      padding: 20px 14px 16px;
      min-height: 20px;
      font-style: italic;
    }

    /* ---- big button ---- */
    .add-btn {
      position: relative;
      overflow: hidden;
      flex: 1;
      min-height: 150px;
      margin: 2px 0 16px;
      border: none;
      border-radius: 28px;
      background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
      color: var(--btn-text);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 14px 36px var(--btn-glow), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
      user-select: none;
    }
    .add-btn:active {
      transform: scale(0.975) translateY(2px);
      box-shadow: 0 6px 16px var(--btn-glow), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .add-label, .add-btn small { position: relative; z-index: 1; }
    .add-btn small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.5; margin-top: 10px; }
    /* touch ripple from the tap point */
    .ripple {
      position: absolute; z-index: 0; border-radius: 50%;
      background: rgba(255,255,255,0.45);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: ripple 0.5s ease-out forwards;
    }
    @keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

    .row { display: flex; gap: 12px; margin-bottom: 18px; }
    .row button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: background 0.15s ease, transform 0.08s ease;
    }
    .row button:active { background: var(--surface-2); transform: scale(0.98); }
    .row button:disabled { opacity: 0.35; box-shadow: none; }
    .row .end { color: var(--accent); }
    .quick-cap { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--faint); margin: 2px 0 8px; }
    .quick-row { margin-bottom: 12px; }
    .quick-row .quick {
      padding: 13px; font-size: 14px; font-weight: 700;
      font-variant-numeric: tabular-nums; letter-spacing: 0.2px;
    }
    .quick-row #quickPlusBtn { color: var(--accent); }
    .quick-row #quickMinusBtn { color: var(--muted); }

    /* ---- cards ---- */
    .chart-card, .history { background: var(--surface); border-radius: 22px; box-shadow: var(--card-shadow); }
    .chart-card { padding: 18px 16px 12px; margin-bottom: 14px; }
    .section-title {
      font-size: 12px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase;
      color: var(--muted); margin: 0 2px 10px;
    }
    .chart-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 10px; }
    .chart-head .section-title { margin: 0; }
    .chart-legend:not(:empty) { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--over); }
    .chart-legend i { display: inline-block; width: 14px; height: 0; border-top: 1px dashed var(--over); }
    .chart-stats {
      display: flex; flex-wrap: wrap; gap: 4px 18px;
      font-size: 13px; color: var(--muted);
      margin: 0 2px 14px;
    }
    .chart-stats b { color: var(--text); font-weight: 700; }
    .chart { position: relative; display: flex; align-items: flex-end; gap: 5px; height: 84px; }
    .bar { flex: 1; min-width: 5px; background: var(--surface-2); border-radius: 4px 4px 2px 2px; min-height: 3px; transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    .bar.today { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
    .bar.over { background: linear-gradient(180deg, #ff6b5e, var(--over)); }
    /* dashed line marking the daily goal across the chart */
    .cap-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--over); opacity: 0.5; pointer-events: none; }
    .chart-labels { display: flex; gap: 5px; margin-top: 7px; }
    .chart-labels span { flex: 1; min-width: 5px; text-align: center; font-size: 10px; font-weight: 600; color: var(--faint); }
    .chart-labels span.today { color: var(--accent); }

    .history { padding: 4px 0; margin-bottom: 16px; max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .history .section-title { margin: 14px 18px 4px; }
    .hist-row { padding: 13px 18px; border-top: 1px solid var(--hair); cursor: pointer; transition: background 0.15s ease; }
    .hist-row:first-of-type { border-top: none; }
    .hist-row:active { background: var(--surface-2); }
    .hist-row.enter { animation: rowin .45s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes rowin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .hist-top { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
    .hist-top .date { color: var(--text); font-weight: 500; }
    .hist-top .amt { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--surface-2); padding: 3px 11px; border-radius: 999px; font-size: 14px; }
    .hist-note { font-size: 13px; color: var(--faint); margin-top: 5px; line-height: 1.35; }
    .hist-empty { padding: 22px; color: var(--faint); font-size: 14px; text-align: center; }

    /* ---- toast ---- */
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2); color: var(--text);
      padding: 13px 22px; border-radius: 999px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 12px 34px rgba(0,0,0,0.45); border: 1px solid var(--hair);
      z-index: 50; max-width: 88%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- bottom sheet ---- */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center; z-index: 40;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--surface);
      border-radius: 26px 26px 0 0;
      padding: 14px 20px calc(26px + env(safe-area-inset-bottom));
      box-shadow: 0 -12px 50px rgba(0,0,0,0.5);
      overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
      max-height: 90vh; max-height: 90dvh;
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .overlay.show .sheet { transform: translateY(0); }
    .sheet::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 999px; background: var(--surface-2); margin: 0 auto 16px; }
    .sheet h3 { margin: 0 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
    .sheet p.sub { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
    .sheet input, .sheet textarea {
      width: 100%; max-width: 100%; min-width: 0; padding: 14px; font-size: 17px;
      border-radius: 12px; border: 1px solid var(--surface-2);
      background: var(--bg); color: var(--text);
      font-family: inherit; font-variant-numeric: tabular-nums;
      transition: border-color 0.2s ease;
    }
    .sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--accent); }
    .sheet textarea { resize: none; font-variant-numeric: normal; }
    /* iOS renders time/date pickers with an intrinsic width that overflows
       the sheet; reset their native appearance so they honour width:100%. */
    .sheet input[type="time"], .sheet input[type="datetime-local"], .sheet input[type="date"] {
      -webkit-appearance: none; appearance: none;
      display: block; text-align: left;
    }
    .sheet input[type="time"]::-webkit-date-and-time-value,
    .sheet input[type="datetime-local"]::-webkit-date-and-time-value,
    .sheet input[type="date"]::-webkit-date-and-time-value {
      text-align: left; margin: 0;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
    .toggle-row span { font-size: 16px; }
    .switch { position: relative; width: 52px; height: 31px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--surface-2); border-radius: 999px; transition: 0.25s; }
    .slider:before { content: ""; position: absolute; height: 27px; width: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.25s; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .switch input:checked + .slider { background: var(--safe); }
    .switch input:checked + .slider:before { transform: translateX(21px); }
    .sheet-btn {
      display: block; width: 100%; padding: 16px; margin-top: 12px;
      border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
      background: var(--surface-2); color: var(--text);
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .sheet-btn:active { transform: scale(0.985); filter: brightness(0.92); }
    .sheet-btn.primary { background: var(--accent); color: var(--btn-text); }
    .sheet-btn.danger { background: transparent; color: var(--over); }
    .sheet-btn.ghost { background: transparent; color: var(--muted); }
    .sheet-btn.link { background: transparent; color: var(--accent); margin-top: 6px; }
    .sheet-divider { height: 1px; background: var(--hair); margin: 18px 0 2px; border: none; }

    /* ---- insights panel ---- */
    .panel-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center; z-index: 25;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .panel-overlay.show { opacity: 1; pointer-events: auto; }
    .panel {
      width: 100%; max-width: 480px; background: var(--bg);
      border-radius: 26px 26px 0 0; max-height: 92vh;
      display: flex; flex-direction: column;
      box-shadow: 0 -12px 50px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .panel-overlay.show .panel { transform: translateY(0); }
    .panel::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 999px; background: var(--surface-2); margin: 10px auto 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 8px; }
    .panel-head h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .panel-close { background: none; border: none; color: var(--accent); font-size: 16px; font-weight: 700; cursor: pointer; padding: 6px 4px; }
    .panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px calc(20px + env(safe-area-inset-bottom)); }
    .panel-body .history { max-height: none; }
    .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tile { background: var(--surface); border-radius: 16px; padding: 15px 14px; box-shadow: var(--card-shadow); }
    .tile-val { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .tile-val.good { color: var(--safe); }
    .tile-val.bad { color: var(--over); }
    .tile-lbl { font-size: 12px; color: var(--muted); margin-top: 5px; font-weight: 500; }
    .tile-delta { font-size: 11px; font-weight: 700; margin-top: 6px; }
    .tile-delta.down { color: var(--safe); }
    .tile-delta.up { color: var(--over); }
    .tile-delta.flat { color: var(--muted); }

    /* ---- today's tap timeline (insights) ---- */
    .tap-list { display: flex; flex-direction: column; }
    .tap-row {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 2px; border-top: 1px solid var(--hair);
      font-size: 14px; font-variant-numeric: tabular-nums;
    }
    .tap-row:first-child { border-top: none; }
    .tap-row .tap-t { color: var(--muted); flex: 1; }
    .tap-row .tap-amt { color: var(--accent); font-weight: 700; }
    .tap-row .tap-amt.neg { color: var(--muted); }
    .tap-row .tap-total {
      font-weight: 700; color: var(--muted); background: var(--surface-2);
      padding: 3px 11px; border-radius: 999px; font-size: 13px; min-width: 44px; text-align: center;
    }
    .tap-empty { font-size: 13px; color: var(--faint); }
    .tap-scroll { max-height: 34vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 2px; }

    /* ---- time since cards ---- */
    .since-card { background: var(--surface); border-radius: 18px; padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--card-shadow); cursor: pointer; transition: transform 0.08s ease; overflow: hidden; }
    .since-card:active { transform: scale(0.99); }
    .since-name { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
    .since-big { font-size: 44px; font-weight: 300; letter-spacing: -1.5px; line-height: 1.1; margin-top: 6px; color: var(--accent); }
    .since-big .since-unit { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
    .since-detail { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .since-start { font-size: 12px; color: var(--faint); margin-top: 8px; }
    .since-empty { color: var(--faint); font-size: 14px; text-align: center; padding: 24px 10px; line-height: 1.5; }
    .since-prog { margin-top: 14px; }
    .since-prog-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .since-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .since-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    .since-stats { font-size: 12px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
    .since-stats b { color: var(--text); font-weight: 700; }
    .since-note { margin-top: 10px; font-size: 13px; color: var(--muted); font-style: italic; line-height: 1.4; }
    .since-saved { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .since-saved-val { font-size: 22px; font-weight: 700; color: var(--safe); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .since-saved-sub { font-size: 12px; color: var(--muted); }
    .since-miles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .since-mile { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--faint); }
    .since-mile.reached { background: rgba(255,149,0,0.16); color: var(--accent); }
    .since-mile.next { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }

    /* ---- water tracker (separate panel) ---- */
    .water-card { background: var(--surface); border-radius: 22px; box-shadow: var(--card-shadow); padding: 24px 18px 20px; text-align: center; margin-bottom: 14px; }
    .water-big { font-size: 60px; font-weight: 300; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--water); }
    .water-big .water-unit { font-size: 22px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
    .water-goal { font-size: 14px; color: var(--muted); margin-top: 12px; }
    .water-goal.done { color: var(--water); font-weight: 700; }
    .water-bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 16px; }
    .water-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--water-2), var(--water)); transition: width 0.45s cubic-bezier(0.22,1,0.36,1); }
    .water-add {
      width: 100%; border: none; border-radius: 20px; padding: 20px; margin-top: 2px;
      background: linear-gradient(180deg, var(--water-2), var(--water)); color: #fff;
      font-size: 22px; font-weight: 700; cursor: pointer; letter-spacing: 0.2px;
      box-shadow: 0 10px 26px rgba(10,132,255,0.34), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 0.1s ease;
    }
    .water-add:active { transform: scale(0.98) translateY(1px); }
    .water-row { display: flex; gap: 12px; margin-top: 12px; }
    .water-row button { flex: 1; padding: 14px; border: none; border-radius: 14px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: var(--card-shadow); transition: background 0.15s ease, transform 0.08s ease; }
    .water-row button:active { background: var(--surface-2); transform: scale(0.98); }
    .water-row button:disabled { opacity: 0.35; box-shadow: none; }
    .water-section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; color: var(--muted); margin: 22px 2px 10px; }
    .water-presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .water-preset { flex: none; padding: 9px 15px; border-radius: 999px; border: none; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: var(--card-shadow); font-variant-numeric: tabular-nums; transition: transform 0.08s ease; }
    .water-preset:active { transform: scale(0.94); }
    .water-preset.on { background: var(--water); color: #fff; box-shadow: none; }
    .water-preset.add { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hair); color: var(--muted); font-size: 18px; padding: 8px 16px; }
    .water-presets.manage { margin: 4px 0 2px; }
    .water-mchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 9px 10px 9px 14px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .water-mchip-x { background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .water-mchip-x:active { color: var(--over); }
    .water-stat { font-size: 13px; color: var(--muted); margin-top: 16px; text-align: center; }
    .water-stat b { color: var(--text); font-weight: 700; }

    /* ---- daily reminder banner ---- */
    .reminder {
      display: flex; align-items: center; gap: 10px;
      margin: 6px 0 2px; padding: 11px 14px;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 14px; font-size: 14px; font-weight: 600; color: var(--text);
      box-shadow: var(--card-shadow); overflow: hidden;
    }
    .reminder span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reminder-x { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px 2px; }

    /* ---- compact "time since" strip on the main page ---- */
    .since-strip { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 6px 0 2px; padding-bottom: 2px; scrollbar-width: none; }
    .since-strip::-webkit-scrollbar { display: none; }
    .ss-chip {
      flex: none; display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--hair);
      border-radius: 999px; padding: 8px 14px; cursor: pointer;
      box-shadow: var(--card-shadow); transition: transform 0.08s ease;
    }
    .ss-chip:active { transform: scale(0.96); }
    .ss-chip svg { color: var(--muted); flex: none; }
    .ss-name { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ss-val { font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

    /* ---- calendar heatmap + weekday bars (insights) ---- */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-nav .section-title { margin: 0; }
    .cal-nav-btn {
      background: var(--surface-2); border: none; color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s ease, transform 0.08s ease;
    }
    .cal-nav-btn:active { transform: scale(0.9); }
    .cal-nav-btn:disabled { opacity: 0.28; cursor: default; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-head { font-size: 10px; font-weight: 700; color: var(--faint); text-align: center; padding-bottom: 2px; }
    .cal-day {
      aspect-ratio: 1 / 1; border-radius: 7px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--muted);
    }
    .cal-day.blank { background: transparent; }
    .cal-day.empty { background: transparent; color: var(--faint); }
    .cal-day.logged { background: var(--accent-dim); color: #fff; }
    .cal-day.under { background: var(--safe); color: #04210d; }
    .cal-day.over { background: var(--over); color: #2b0707; }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11px; color: var(--muted); }
    .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

    .wk { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
    .wk-bar { flex: 1; background: var(--surface-2); border-radius: 4px 4px 2px 2px; min-height: 3px; }
    .wk-bar.peak { background: linear-gradient(180deg, #ff6b5e, var(--over)); }
    .wk-labels { display: flex; gap: 6px; margin-top: 7px; }
    .wk-labels span { flex: 1; text-align: center; font-size: 10px; font-weight: 600; color: var(--faint); }
    .wk-callout { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .wk-callout b { color: var(--text); font-weight: 700; }

    /* ---- time-of-day chart (insights) ---- */
    .tod { display: flex; align-items: flex-end; gap: 2px; height: 64px; }
    .tod-bar { flex: 1; background: var(--surface-2); border-radius: 3px 3px 1px 1px; min-height: 2px; }
    .tod-bar.peak { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
    .tod-labels { display: flex; justify-content: space-between; margin-top: 7px; }
    .tod-labels span { font-size: 10px; font-weight: 600; color: var(--faint); }

    /* ---- app lock ---- */
    .lock {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 28px);
    }
    .lock-inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
    .lock-ring { filter: drop-shadow(0 0 12px rgba(255,149,0,0.55)); margin-bottom: 24px; }
    .lock-title { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
    .lock-dots { display: flex; gap: 22px; margin-top: 30px; }
    .lock-dots i {
      width: 13px; height: 13px; border-radius: 50%; background: transparent;
      border: 1.5px solid var(--faint);
      transition: transform 0.18s cubic-bezier(0.22,1,0.36,1), background 0.18s ease, border-color 0.18s ease;
    }
    .lock-dots i.on { background: var(--accent); border-color: var(--accent); transform: scale(1.18); }
    .lock-error { min-height: 18px; color: var(--over); font-size: 13px; font-weight: 600; margin-top: 16px; letter-spacing: 0.1px; }
    .lock.shake .lock-dots { animation: nudge .42s ease; }

    .lock-pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 20px 26px; margin-top: 26px; }
    .lock-key {
      height: 76px; width: 76px; border-radius: 50%; border: none;
      background: var(--key); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
      transition: background 0.1s ease, transform 0.05s ease;
    }
    .lock-key .num { font-size: 31px; font-weight: 400; line-height: 1; letter-spacing: 0.5px; }
    .lock-key .abc { font-size: 9px; font-weight: 700; letter-spacing: 1.6px; color: var(--muted); height: 10px; margin-top: 3px; }
    .lock-key.pressed, .lock-key:active { background: var(--key-press); transform: scale(0.92); }
    .lock-key.fn {
      background: transparent; font-size: 15px; font-weight: 600; color: var(--accent);
    }
    .lock-key.fn.pressed, .lock-key.fn:active { background: transparent; transform: scale(0.9); opacity: 0.55; }
    .lock-key.blank { background: transparent; pointer-events: none; }

    .version {
      text-align: center;
      font-size: 11px;
      color: var(--faint);
      padding: 8px 0 4px;
      letter-spacing: 0.3px;
    }
    /* Respect the OS "Reduce Motion" setting */
    @media (prefers-reduced-motion: reduce) {
      .total .value.bump, .ring-wrap.nudge, .ring-wrap.pulse, .hist-row.enter, .ripple, .lock.shake .lock-dots { animation: none; }
      .ring-prog, .sheet, .overlay, .ring-wrap::before, .bar, .water-bar i, .since-bar i { transition: none; }
    }
  </style>
  <script>
    // Apply the saved theme before first paint so there's no colour flash.
    try { if (JSON.parse(localStorage.getItem("count.theme")) === "blue") document.documentElement.setAttribute("data-theme", "blue"); } catch (e) {}
  </script>
</head>
<body>
  <header>
    <div class="header-title">
      <div class="eyebrow">Today</div>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="header-actions">
      <button class="iconbtn" id="sinceBtn" aria-label="Time since">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
      <button class="iconbtn" id="waterBtn" aria-label="Water">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
      </button>
      <button class="iconbtn" id="statsBtn" aria-label="Insights">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-7"/></svg>
      </button>
      <button class="gear" id="gearBtn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div class="reminder" id="reminderBanner" style="display:none">
    <span id="reminderText">Don't forget to track today.</span>
    <button class="reminder-x" id="reminderDismiss" aria-label="Dismiss">✕</button>
  </div>

  <!-- compact live "time since" strip — tap any chip to open the full panel -->
  <div class="since-strip" id="sinceStrip" style="display:none"></div>

  <div class="total" id="totalWrap">
    <div class="ring-wrap" id="ringWrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc46b"></stop>
            <stop offset="1" stop-color="#ff9500"></stop>
          </linearGradient>
          <linearGradient id="gradSafe" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5be584"></stop>
            <stop offset="1" stop-color="#28c24c"></stop>
          </linearGradient>
          <linearGradient id="gradWarn" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffcf6b"></stop>
            <stop offset="1" stop-color="#ff9f0a"></stop>
          </linearGradient>
          <linearGradient id="gradOver" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff7a6e"></stop>
            <stop offset="1" stop-color="#ff3b30"></stop>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="60" cy="60" r="54"></circle>
        <circle class="ring-prog" id="ringProg" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="ring-center"><span class="value" id="total">0</span></div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="goal-label" id="goalText"></div>
  </div>

  <div class="quote" id="quote"></div>

  <button class="add-btn" id="addBtn">
    <span class="add-label">+ 0.50</span>
    <small>tap to add</small>
  </button>

  <div class="quick-cap">Adjust amount per tap</div>
  <div class="row quick-row">
    <button class="quick" id="quickMinusBtn">− 0.25</button>
    <button class="quick" id="quickPlusBtn">+ 0.25</button>
  </div>

  <div class="row">
    <button id="undoBtn" disabled>Undo</button>
    <button class="end" id="endBtn">End Day</button>
  </div>

  <div class="version">v4.1 · © Avery LLC</div>

  <!-- App Lock screen: covers everything until unlocked -->
  <div class="lock" id="lockScreen" style="display:none">
    <div class="lock-inner">
      <svg class="lock-ring" viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="118 200" transform="rotate(-90 32 32)"></circle>
      </svg>
      <div class="lock-title" id="lockTitle">Enter passcode</div>
      <div class="lock-dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
      <div class="lock-error" id="lockError"></div>
      <div class="lock-pad" id="lockPad"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- Insights panel: chart, stats and history live here to keep the home screen clean -->
  <div class="panel-overlay" id="insightsOverlay">
    <div class="panel" id="insightsPanel">
      <div class="panel-head">
        <h3>Insights</h3>
        <button class="panel-close" id="insightsClose">Done</button>
      </div>
      <div class="panel-body">
        <div class="insights-grid" id="insightsGrid"></div>

        <div class="chart-card" id="tapLogCard" style="display:none"></div>
        <div class="chart-card" id="calCard" style="display:none"></div>
        <div class="chart-card" id="weekdayCard" style="display:none"></div>
        <div class="chart-card" id="timeCard" style="display:none"></div>

        <div class="chart-card" id="chartCard" style="display:none">
          <div class="chart-head">
            <div class="section-title" id="chartTitle">Last days</div>
            <div class="chart-legend" id="chartLegend"></div>
          </div>
          <div class="chart-stats" id="chartStats"></div>
          <div class="chart" id="chart"></div>
          <div class="chart-labels" id="chartLabels"></div>
        </div>

        <div class="history" id="history">
          <div class="section-title">History</div>
          <div class="hist-empty" id="histEmpty">No previous days yet.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Time Since: a separate little tool — counts up from a date -->
  <div class="panel-overlay" id="sinceOverlay">
    <div class="panel">
      <div class="panel-head">
        <h3>Time Since</h3>
        <button class="panel-close" id="sinceClose">Done</button>
      </div>
      <div class="panel-body">
        <div id="sinceList"></div>
        <button class="sheet-btn primary" id="sinceAdd" style="margin-top:6px">+ New tracker</button>
      </div>
    </div>
  </div>

  <!-- Water: a separate daily hydration counter (auto-resets each day) -->
  <div class="panel-overlay" id="waterOverlay">
    <div class="panel">
      <div class="panel-head">
        <h3>Water</h3>
        <button class="panel-close" id="waterClose">Done</button>
      </div>
      <div class="panel-body" id="waterBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
