<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="&#160;" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>&#160;</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --hair: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #939397;
      --faint: #67676b;
      --accent: #ff9500;
      --accent-2: #ffb340;
      --safe: #30d158;   /* comfortably under the goal */
      --warn: #ff9f0a;   /* getting close to the goal */
      --over: #ff453a;   /* over the goal */
      --card-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 14px 34px rgba(0,0,0,0.38);
      --btn-glow: rgba(255,149,0,0.38);
      --btn-text: #1a1300;   /* text on the accent button */
      --key: rgba(255,255,255,0.10);
      --key-press: rgba(255,255,255,0.22);
      --water: #0a84ff;
      --water-2: #64b5ff;
      /* soft, muted ramp for the big number as it nears the goal */
      --num-lo: #7cc6a2;   /* soft sage green */
      --num-mid: #f0a85a;  /* warm amber, close to the accent */
      --num-hi: #e2726a;   /* muted coral, not a harsh red */
      /* ring gradient stops, halos + glows — variables so themes can retint them */
      --r-acc-1: #ffc46b; --r-acc-2: #ff9500;
      --r-safe-1: #5be584; --r-safe-2: #28c24c;
      --r-warn-1: #ffcf6b; --r-warn-2: #ff9f0a;
      --r-over-1: #ff7a6e; --r-over-2: #ff3b30;
      --halo-safe: rgba(48,209,88,0.20); --halo-warn: rgba(255,159,10,0.22); --halo-over: rgba(255,69,58,0.24);
      --glow-safe: rgba(48,209,88,0.45); --glow-warn: rgba(255,159,10,0.45); --glow-over: rgba(255,69,58,0.50);
    }
    /* One type scale for the whole app, so every screen feels related.
       hero → the big number; display → panel headline numbers; title → card
       and sheet headings; body → normal copy; small → captions; micro → labels. */
    :root {
      --fs-hero: 72px;
      --fs-display: 44px;
      --fs-title: 21px;
      --fs-lg: 26px;
      --fs-body: 15px;
      --fs-small: 13px;
      --fs-micro: 11px;
    }
    /* Motion and spacing tokens. Four durations by intent, three curves, one
       spacing rhythm — so timing and padding stay consistent as things get
       added. Deliberate exceptions (the breathing orb, the reminder bar, the
       ring sweep) keep literal values and say why. */
    :root {
      --dur-fast: 0.12s;    /* press feedback */
      --dur-base: 0.25s;    /* ordinary state changes */
      --dur-slow: 0.45s;    /* entrances, bars growing */
      --dur-panel: 0.36s;   /* sheets and panels sliding */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);        /* the house curve */
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* pops, celebrations */
      --ease-panel: cubic-bezier(0.32, 0.72, 0, 1);      /* sheet/panel slides */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 22px; --sp-6: 28px;
    }
    /* Follow the phone's appearance: light mode gets a light skin. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --surface: #ffffff;
        --surface-2: #e9e9ee;
        --hair: rgba(0,0,0,0.07);
        --text: #1c1c1e;
        --muted: #8e8e93;
        --faint: #b0b0b5;
        --accent: #ff9500;
        --accent-2: #ffb340;
        --safe: #34c759;
        --warn: #ff9500;
        --over: #ff3b30;
        --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 26px rgba(0,0,0,0.07);
        --btn-glow: rgba(255,149,0,0.30);
        --btn-text: #1a1300;
        --key: rgba(0,0,0,0.05);
        --key-press: rgba(0,0,0,0.12);
        --water: #007aff;
        --water-2: #4da3ff;
        /* slightly deeper on a light background so they stay legible */
        --num-lo: #3f9f74;
        --num-mid: #d88a35;
        --num-hi: #cf5f56;
      }
    }
    /* ---- alternate themes (Settings picker) ----
       Shared block: every non-default theme is dark, with white hairlines and
       one cohesive muted status/ring/glow set, so the ring never clashes.
       Each theme below then only supplies its own core palette + accent. */
    :root[data-theme] {
      --hair: rgba(255,255,255,0.09);
      --card-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 14px 34px rgba(0,0,0,0.45);
      --key: rgba(255,255,255,0.10);
      --key-press: rgba(255,255,255,0.24);
      --btn-text: #ffffff;
      --safe: #4cc38a; --warn: #f0a85a; --over: #e2726a;
      --r-safe-1: #7ad9ae; --r-safe-2: #3fa374;
      --r-warn-1: #f6c98f; --r-warn-2: #e2934a;
      --r-over-1: #ef9089; --r-over-2: #cf5f56;
      --halo-safe: rgba(76,195,138,0.20); --halo-warn: rgba(240,168,90,0.22); --halo-over: rgba(226,114,106,0.24);
      --glow-safe: rgba(76,195,138,0.45); --glow-warn: rgba(240,168,90,0.45); --glow-over: rgba(226,114,106,0.50);
      --num-lo: #8fc9b4; --num-mid: #f0a85a; --num-hi: #e2726a;
    }
    :root[data-theme="blue"] {   /* Mono — simple black & white */
      --bg: #000000; --surface: #161616; --surface-2: #242424;
      --text: #ffffff; --muted: #9a9a9a; --faint: #636363;
      --accent: #ffffff; --accent-2: #ffffff; --r-acc-1: #f2f2f2; --r-acc-2: #cfcfcf;
      --btn-glow: rgba(255,255,255,0.18); --btn-text: #000000;
      /* greyscale status + ring so nothing is coloured */
      --safe: #d6d6d6; --warn: #b0b0b0; --over: #ffffff;
      --r-safe-1: #f0f0f0; --r-safe-2: #c8c8c8;
      --r-warn-1: #d4d4d4; --r-warn-2: #a4a4a4;
      --r-over-1: #ffffff; --r-over-2: #d8d8d8;
      --halo-safe: rgba(255,255,255,0.10); --halo-warn: rgba(255,255,255,0.12); --halo-over: rgba(255,255,255,0.16);
      --glow-safe: rgba(255,255,255,0.30); --glow-warn: rgba(255,255,255,0.35); --glow-over: rgba(255,255,255,0.50);
      --num-lo: #cfcfcf; --num-mid: #e8e8e8; --num-hi: #ffffff;
    }
    :root[data-theme="forest"] {   /* Midnight — Invincible's blue & black suit */
      --bg: #090b12; --surface: #141824; --surface-2: #1e2433;
      --text: #eef2fb; --muted: #97a1b6; --faint: #5f6a80;
      --accent: #2f7ff2; --accent-2: #5b9cff; --r-acc-1: #5b9cff; --r-acc-2: #2f7ff2;
      --btn-glow: rgba(47,127,242,0.42); --btn-text: #ffffff;
    }
    :root[data-theme="teal"] {   /* Spidey — Advanced Suit red & white (light, white-forward) */
      --bg: #edeef2; --surface: #ffffff; --surface-2: #e2e4ec;
      --text: #17181d; --muted: #606572; --faint: #848992;
      --accent: #e01f2b; --accent-2: #f23b45; --r-acc-1: #f23b45; --r-acc-2: #e01f2b;
      --btn-glow: rgba(224,31,43,0.30); --btn-text: #ffffff;
      --hair: rgba(0,0,0,0.08);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 12px 26px rgba(0,0,0,0.08);
      --key: rgba(0,0,0,0.05); --key-press: rgba(0,0,0,0.12);
      --safe: #1a9e5f; --warn: #d98a1f; --over: #d1332b;
      --r-safe-1: #38c98a; --r-safe-2: #1a9e5f;
      --r-warn-1: #f0b45a; --r-warn-2: #d98a1f;
      --r-over-1: #f0574d; --r-over-2: #d1332b;
      --halo-safe: rgba(26,158,95,0.16); --halo-warn: rgba(217,138,31,0.18); --halo-over: rgba(209,51,43,0.18);
      --glow-safe: rgba(26,158,95,0.35); --glow-warn: rgba(217,138,31,0.35); --glow-over: rgba(209,51,43,0.40);
      --num-lo: #2f9e6a; --num-mid: #d98a1f; --num-hi: #d1332b;
    }
    :root[data-theme="grove"] {    /* Grove — forest green & burnt orange */
      --bg: #12210f; --surface: #1c2e1b; --surface-2: #2c4531;
      --text: #eaf0e6; --muted: #9eaf9a; --faint: #667761;
      --accent: #a9531f; --accent-2: #c96c31; --r-acc-1: #c96c31; --r-acc-2: #a9531f;
      --btn-glow: rgba(169,83,31,0.42);
      /* the palette's teal-green carries "safe" so the ring stays in-family */
      --safe: #4f9a7f; --r-safe-1: #6fbb9d; --r-safe-2: #3f6e5e;
      --halo-safe: rgba(79,154,127,0.20); --glow-safe: rgba(79,154,127,0.45);
      --num-lo: #7fb79b;
    }
    :root[data-theme="dusk"] {     /* Dusk — navy, mauve & terracotta */
      --bg: #151e3c; --surface: #1e2a52; --surface-2: #2a3868;
      --text: #e7ebef; --muted: #aaa0bd; --faint: #78728e;
      --accent: #b55f4e; --accent-2: #d0785f; --r-acc-1: #d0785f; --r-acc-2: #b55f4e;
      --btn-glow: rgba(181,95,78,0.42);
    }
    :root[data-theme="nocturne"] { /* Nocturne — midnight navy & pale lavender */
      --bg: #080908; --surface: #14192b; --surface-2: #1d2a47;
      --text: #d5d8ec; --muted: #8790ae; --faint: #6e626c;
      --accent: #c6cbe8; --accent-2: #d5d8ec; --r-acc-1: #d5d8ec; --r-acc-2: #9aa3c9;
      --btn-glow: rgba(213,216,236,0.28); --btn-text: #12172a;   /* light accent ⇒ dark label */
    }
    :root[data-theme="roast"] {    /* Roast — coffee, navy & sand */
      --bg: #141315; --surface: #241914; --surface-2: #3e2c25;
      --text: #edebe9; --muted: #a6968b; --faint: #74645a;
      --accent: #e5bc93; --accent-2: #f0d0af; --r-acc-1: #f0d0af; --r-acc-2: #e5bc93;
      --btn-glow: rgba(229,188,147,0.34); --btn-text: #2a1d16;   /* light accent ⇒ dark label */
      --water: #3c64a0; --water-2: #6e93cc;                      /* the palette's navy */
    }
    :root[data-theme="plum"] {     /* Plum — deep aubergine & magenta */
      --bg: #17101f; --surface: #221630; --surface-2: #33224a;
      --text: #f1e9f8; --muted: #a493b4; --faint: #706181;
      --accent: #e05fa8; --accent-2: #f07fbe; --r-acc-1: #f07fbe; --r-acc-2: #e05fa8;
      --btn-glow: rgba(224,95,168,0.40); --btn-text: #1d1226;   /* bright accent ⇒ dark label */
      --num-lo: #b79ac9;
    }
    :root[data-theme="abyss"] {    /* Abyss — near-black & cyan */
      --bg: #06090c; --surface: #0e151b; --surface-2: #18242e;
      --text: #dce9f0; --muted: #8ba2b0; --faint: #5b7280;
      --accent: #22c4d6; --accent-2: #5adbe9; --r-acc-1: #5adbe9; --r-acc-2: #22c4d6;
      --btn-glow: rgba(34,196,214,0.34); --btn-text: #04191d;   /* bright accent ⇒ dark label */
      --water: #22c4d6; --water-2: #7ae3ef;
      --num-lo: #7fc9bf;
    }
    /* ---- light themes ----
       The shared :root[data-theme] block above assumes a dark ground, so each
       of these has to re-invert hairlines, shadows, key fills, the button
       label and the whole status/ring/glow set. Scarlet is the template. */
    :root[data-theme="paper"] {    /* Paper — warm cream & deep teal-green */
      --bg: #f6f1e7; --surface: #fffdf8; --surface-2: #ebe3d4;
      --text: #221e18; --muted: #6b6357; --faint: #948a7e;
      --accent: #0f6b57; --accent-2: #178a71; --r-acc-1: #178a71; --r-acc-2: #0f6b57;
      --btn-glow: rgba(15,107,87,0.26); --btn-text: #ffffff;
      --hair: rgba(0,0,0,0.10);
      --card-shadow: 0 1px 2px rgba(80,60,30,0.05), 0 12px 26px rgba(80,60,30,0.09);
      --key: rgba(0,0,0,0.05); --key-press: rgba(0,0,0,0.12);
      --safe: #1a7a52; --warn: #a8710f; --over: #b23b2c;
      --r-safe-1: #35a271; --r-safe-2: #1a7a52;
      --r-warn-1: #d19a3a; --r-warn-2: #a8710f;
      --r-over-1: #d4614f; --r-over-2: #b23b2c;
      --halo-safe: rgba(26,122,82,0.16); --halo-warn: rgba(168,113,15,0.18); --halo-over: rgba(178,59,44,0.18);
      --glow-safe: rgba(26,122,82,0.32); --glow-warn: rgba(168,113,15,0.32); --glow-over: rgba(178,59,44,0.36);
      --num-lo: #1a7a52; --num-mid: #a8710f; --num-hi: #b23b2c;
      --water: #1f6f8b; --water-2: #3d95b3;
    }
    :root[data-theme="clarity"] {  /* Clarity — built for glare and tired eyes;
                                      every text pair aims past AA, body past AAA */
      --bg: #ffffff; --surface: #ffffff; --surface-2: #ebedf0;
      --text: #000000; --muted: #4a4f57; --faint: #6b7178;
      --accent: #0b4fd8; --accent-2: #2668ee; --r-acc-1: #2668ee; --r-acc-2: #0b4fd8;
      --btn-glow: rgba(11,79,216,0.24); --btn-text: #ffffff;
      --hair: rgba(0,0,0,0.18);                                  /* stronger — definition matters more than subtlety here */
      --card-shadow: 0 1px 2px rgba(0,0,0,0.10), 0 10px 22px rgba(0,0,0,0.10);
      --key: rgba(0,0,0,0.07); --key-press: rgba(0,0,0,0.16);
      --safe: #0a6b3d; --warn: #8a5600; --over: #b3261e;
      --r-safe-1: #128a51; --r-safe-2: #0a6b3d;
      --r-warn-1: #b57200; --r-warn-2: #8a5600;
      --r-over-1: #d2382e; --r-over-2: #b3261e;
      --halo-safe: rgba(10,107,61,0.14); --halo-warn: rgba(138,86,0,0.16); --halo-over: rgba(179,38,30,0.16);
      --glow-safe: rgba(10,107,61,0.30); --glow-warn: rgba(138,86,0,0.30); --glow-over: rgba(179,38,30,0.34);
      --num-lo: #0a6b3d; --num-mid: #8a5600; --num-hi: #b3261e;
      --water: #0b4fd8; --water-2: #2668ee;
    }
    /* SVG ring gradient stops read from variables so themes retint them */
    #gradAccent stop:nth-child(1) { stop-color: var(--r-acc-1); }
    #gradAccent stop:nth-child(2) { stop-color: var(--r-acc-2); }
    #gradSafe stop:nth-child(1) { stop-color: var(--r-safe-1); }
    #gradSafe stop:nth-child(2) { stop-color: var(--r-safe-2); }
    #gradWarn stop:nth-child(1) { stop-color: var(--r-warn-1); }
    #gradWarn stop:nth-child(2) { stop-color: var(--r-warn-2); }
    #gradOver stop:nth-child(1) { stop-color: var(--r-over-1); }
    #gradOver stop:nth-child(2) { stop-color: var(--r-over-2); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); height: 100%; overflow: hidden; }
    html, body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }
    /* Lock the home screen to one viewport — no scrolling there. Panels and
       sheets are separate position:fixed overlays with their own internal
       scroll, so this doesn't affect them. 100vh is a fallback: it measures
       the *largest* possible viewport, so on iOS Safari (whose address bar
       collapses/expands) content sized to it can peek a few px below the
       visible area — 100dvh tracks the actual visible viewport instead. */
    body {
      background: var(--bg);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      max-width: 480px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 var(--sp-1);
    }
    .header-title .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .header-title { min-width: 0; }
    .header-title .date {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-top: 2px;
      white-space: nowrap;
    }
    .header-actions { flex: none; }
    .header-actions { display: flex; align-items: center; gap: 0; margin-right: -6px; }
    .iconbtn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 7px; display: flex; align-items: center;
      transition: opacity var(--dur-base) ease, transform var(--dur-base) ease;
      position: relative;
    }
    /* something was deferred rather than shouted at you — it's waiting in here */
    .iconbtn.has-notice::after {
      content: ""; position: absolute; top: 4px; right: 4px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 2px var(--bg);
    }
    .iconbtn:active { opacity: 0.5; transform: scale(0.88); }
    .gear {
      background: none; border: none;
      color: var(--muted); font-size: 22px;
      cursor: pointer; padding: 7px;
      transition: opacity var(--dur-base) ease, transform var(--dur-base) ease;
    }
    .gear:active { opacity: 0.5; transform: rotate(45deg); }

    /* ---- ring / today ---- */
    .total { text-align: center; padding: 10px 0 2px; }
    .ring-wrap {
      position: relative;
      width: 282px; max-width: 76vw;
      margin: 6px auto 0;
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    /* soft coloured aura behind the ring, tinted by the current zone */
    .ring-wrap::before {
      content: "";
      position: absolute; inset: 5%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, var(--halo, transparent) 0%, transparent 68%);
      opacity: 0;
      transition: opacity 0.55s ease, background var(--dur-slow) ease;
    }
    .total.has-goal .ring-wrap::before { opacity: 1; }
    .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
    .ring-track { fill: none; stroke: var(--surface-2); stroke-width: 7; }
    .ring-prog {
      fill: none; stroke: url(#gradAccent); stroke-width: 7;
      /* stroke-linecap is set in JS: flat (butt) early on, rounded from 50% */
      transition: stroke-dashoffset 0.55s var(--ease-out);
    }
    .ring-center { display: flex; align-items: center; justify-content: center; }
    .total .value {
      font-size: var(--fs-hero);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -2.5px;
      font-variant-numeric: tabular-nums;
      transition: color var(--dur-slow) ease;
    }
    .total .value.bump { animation: bump .18s ease; }
    @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 100% { transform: scale(1); } }

    /* Goal is a ceiling: ring, halo + number shift colour as you near and pass it. */
    .total.zone-safe { --halo: var(--halo-safe); }
    .total.zone-warn { --halo: var(--halo-warn); }
    .total.zone-over { --halo: var(--halo-over); }
    .total.zone-safe .ring-prog { stroke: url(#gradSafe); filter: drop-shadow(0 0 6px var(--glow-safe)); }
    .total.zone-warn .ring-prog { stroke: url(#gradWarn); filter: drop-shadow(0 0 6px var(--glow-warn)); }
    .total.zone-over .ring-prog { stroke: url(#gradOver); filter: drop-shadow(0 0 7px var(--glow-over)); }
    /* number colour is set in JS (white→green→orange→red toward the goal); labels keep the zone tint */
    .total.zone-warn .goal-label { color: var(--warn); }
    .total.zone-over .goal-label { color: var(--over); }

    /* ---- bar style (Appearance ‣ Progress) ----
       Same fraction, same zone colours, same number — only the geometry
       differs, so nothing about reading it has to be relearned. */
    .bar-wrap { display: none; width: min(78vw, 300px); height: 14px; margin: var(--sp-4) auto 0;
      background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .bar-wrap i { display: block; height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, var(--r-acc-1), var(--r-acc-2));
      transition: width 0.55s var(--ease-out), background var(--dur-slow) ease; }
    .total.zone-safe .bar-wrap i { background: linear-gradient(90deg, var(--r-safe-1), var(--r-safe-2)); }
    .total.zone-warn .bar-wrap i { background: linear-gradient(90deg, var(--r-warn-1), var(--r-warn-2)); }
    .total.zone-over .bar-wrap i { background: linear-gradient(90deg, var(--r-over-1), var(--r-over-2)); }
    .total.style-bar .bar-wrap { display: block; }
    .total.style-bar .ring { display: none; }
    .total.style-bar .ring-wrap { aspect-ratio: auto; width: auto; height: auto; margin-top: var(--sp-5); cursor: pointer; }
    /* the ring's radial aura has no ring to sit behind here and reads as a
       smudge — the bar carries the zone colour on its own */
    .total.style-bar .ring-wrap::before { display: none; }

    /* ---- milestone day ----
       A thin sheen outside the ring, nothing that changes the reading. The
       caption underneath says which milestone, so it is never a mystery. */
    .ring-wrap::after {
      content: ""; position: absolute; inset: -5px;
      border-radius: 50%; opacity: 0; pointer-events: none;
      background: conic-gradient(from 0deg, transparent 0 62%, var(--accent-2) 78%, transparent 92% 100%);
      -webkit-mask: radial-gradient(circle, transparent 0 47%, #000 48.5%, #000 50%, transparent 51%);
      mask: radial-gradient(circle, transparent 0 47%, #000 48.5%, #000 50%, transparent 51%);
      transition: opacity var(--dur-slow) ease;
    }
    @keyframes mileSpin { to { transform: rotate(360deg); } }
    @keyframes mileSpinRev { to { transform: rotate(-360deg); } }
    @keyframes sheenBreath { 0%, 100% { opacity: 0.30; } 50% { opacity: 0.85; } }

    /* ---- the daily sheen ----
       One variant per day, chosen by date the way the theme rotation is, so it
       holds still while you're using the app and turns over at midnight. Each
       is the same conic ring differing only in arc, speed and direction. */
    .total[class*="spin-"] .ring-wrap::after { opacity: 0.7; animation: mileSpin 8s linear infinite; }

    .total.spin-comet .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 62%, var(--accent-2) 78%, transparent 92% 100%);
      animation-duration: 8s;
    }
    .total.spin-trail .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 40%, var(--accent-2) 82%, transparent 96% 100%);
      animation-duration: 11s; opacity: 0.55;
    }
    .total.spin-twin .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 6%, var(--accent-2) 14%, transparent 22% 56%, var(--accent-2) 64%, transparent 72% 100%);
      animation-duration: 14s; opacity: 0.5;
    }
    .total.spin-drift .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 20%, var(--accent-2) 60%, transparent 98% 100%);
      animation-duration: 20s; opacity: 0.38;
    }
    .total.spin-reverse .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 62%, var(--accent-2) 78%, transparent 92% 100%);
      animation-name: mileSpinRev; animation-duration: 9s;
    }
    .total.spin-breath .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 50%, var(--accent-2) 80%, transparent 94% 100%);
      animation: mileSpin 10s linear infinite, sheenBreath 4.5s ease-in-out infinite;
    }
    /* reserved for milestone days — never in the daily pool, so seeing it means
       something. Brighter, doubled, faster, over a lifted halo. */
    .total.spin-crown .ring-wrap::after {
      background: conic-gradient(from 0deg, transparent 0 4%, var(--accent-2) 12%, transparent 20% 34%, var(--accent) 44%, transparent 54% 70%, var(--accent-2) 80%, transparent 90% 100%);
      animation-duration: 5.5s; opacity: 0.95;
    }
    .total.spin-crown .ring-wrap::before { opacity: 1; filter: saturate(1.3); }

    /* nothing to spin around in bar style — deliberately left clean, except
       that a milestone still gets its glow */
    .total.style-bar .ring-wrap::after { display: none; }
    .total.style-bar.milestone .bar-wrap { box-shadow: 0 0 0 1.5px var(--accent-2), 0 0 14px var(--btn-glow); }
    /* invisible behind a sheet or panel — don't burn cycles animating it */
    body.overlay-up .total[class*="spin-"] .ring-wrap::after { animation-play-state: paused; }

    /* ---- the pulse strip ----
       How you're doing, on the home screen. It animates in so it reads as
       arriving, but it never has to be dismissed — the app already asks enough
       of you on open. Tap to move to the next insight. */
    /* .pulse-strip, not .pulse — the ring-wrap borrows a transient "pulse"
       animation class, and a bare .pulse rule collided with it and knocked the
       centred number out of flex. JS still finds this by id="pulse". */
    .pulse-strip {
      display: block; margin: var(--sp-3) auto 0; max-width: 92%;
      background: none; border: none; padding: 6px var(--sp-3);
      font-family: inherit; font-size: var(--fs-small); font-weight: 600;
      color: var(--muted); line-height: 1.35; cursor: pointer; text-align: center;
      border-radius: 10px;
      animation: pulseIn var(--dur-slow) var(--ease-out) both;
      transition: opacity var(--dur-base) ease, background var(--dur-fast) var(--ease-out);
    }
    .pulse-strip:active { background: var(--key); }
    .pulse-strip b { color: var(--text); font-variant-numeric: tabular-nums; }
    .pulse-strip.swap { opacity: 0; }
    @keyframes pulseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* the trend line draws itself rather than simply appearing — the bars
       already grow in, the line was the odd one out */
    .trend-poly.draw { animation: trendDraw 0.9s var(--ease-out) both; }
    @keyframes trendDraw { from { stroke-dashoffset: var(--dash, 400); } to { stroke-dashoffset: 0; } }

    .ring-wrap.nudge { animation: nudge .42s ease; }
    @keyframes nudge {
      0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    .ring-wrap.pulse { animation: pulse .6s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.045); } 100% { transform: scale(1); } }

    .total .meta { margin-top: var(--sp-4); font-size: 14px; font-weight: 500; color: var(--muted); min-height: 18px; transition: color var(--dur-slow) ease; }
    .total .meta.streak { color: var(--safe); }
    .goal-label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; letter-spacing: 0.2px; min-height: 14px; transition: color var(--dur-slow) ease; }
    .goal-label.hint { color: var(--accent); }


    /* ---- big button ---- */
    .add-btn {
      position: relative;
      overflow: hidden;
      flex: 1;
      min-height: 150px;
      margin: 2px 0 var(--sp-4);
      border: none;
      border-radius: 28px;
      /* flat, solid fill — the ring is the hero, this is just the action */
      background: var(--accent);
      color: var(--btn-text);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
      transition: transform var(--dur-fast) var(--ease-out), filter var(--dur-base) ease;
      user-select: none;
    }
    .add-btn:active {
      transform: scale(0.975) translateY(2px);
      filter: brightness(0.94);
    }
    .add-label, .add-btn small { position: relative; z-index: 1; }
    .add-btn small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.5; margin-top: 10px; }
    /* touch ripple from the tap point */
    .ripple {
      position: absolute; z-index: 0; border-radius: 50%;
      background: rgba(255,255,255,0.45);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: ripple 0.5s ease-out forwards;
    }
    @keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

    .row { display: flex; gap: var(--sp-3); margin-bottom: 18px; }
    /* secondary controls — deliberately quieter than the big add button */
    .row button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px var(--hair);
      transition: background var(--dur-base) ease, transform var(--dur-fast) ease, color var(--dur-base) ease;
    }
    .row button:active { background: var(--surface-2); transform: scale(0.98); }
    .row button:disabled { opacity: 0.4; box-shadow: inset 0 0 0 1px var(--hair); }
    .row .end { color: var(--accent); }

    /* ---- cards ---- */
    .section-title {
      font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase;
      color: var(--muted); margin: 0 2px 10px;
    }
    .chart-card, .history { background: var(--surface); border-radius: 22px; box-shadow: var(--card-shadow); }
    .chart-card { padding: var(--sp-4) var(--sp-4) var(--sp-3); margin-bottom: 14px; }
    /* one card per view gets to be the hero — a soft accent frame */
    .hero-card { box-shadow: var(--card-shadow), inset 0 0 0 1.5px var(--accent); }
    .hero-card .section-title { color: var(--accent); }

    /* insights view switcher */
    .seg-row { display: flex; gap: var(--sp-1); padding: var(--sp-1); margin: 0 var(--sp-4) 10px; background: var(--surface); border-radius: 12px; }
    .seg-btn { flex: 1; border: none; cursor: pointer; background: transparent; color: var(--muted); font-size: var(--fs-small); font-weight: 700; border-radius: 9px; padding: 9px 0; transition: background var(--dur-base) ease, color var(--dur-base) ease; }
    .seg-btn.on { background: var(--surface-2); color: var(--text); }
    /* the same control inside a sheet: no panel side-margins, and inverted
       fills so the selected segment still reads against the sheet surface */
    #sheet .seg-row { margin: var(--sp-2) 0 var(--sp-3); background: var(--surface-2); }
    #sheet .seg-btn.on { background: var(--surface); color: var(--text); }
    /* the live suggestion on the Journey tab */
    .ladder-sug {
      margin-top: var(--sp-3); padding: var(--sp-3);
      background: var(--surface-2); border-radius: 12px;
      border-left: 3px solid var(--accent);
      font-size: var(--fs-small); color: var(--text); line-height: 1.4;
    }
    .ladder-sug b { color: var(--accent); }
    .ladder-sug-sub { display: block; margin-top: 3px; font-size: var(--fs-micro); color: var(--muted); }
    .seg-page { animation: itemIn 0.32s var(--ease-out); }
    /* "more stats" reveal keeps the headline grid scannable */
    .more-stats { display: block; width: 100%; border: none; cursor: pointer; background: transparent; color: var(--muted); font-size: var(--fs-small); font-weight: 700; padding: 2px 0 var(--sp-3); }
    .more-stats:active { color: var(--text); }
    /* a card with nothing to show yet, rather than a hole in the page */
    .card-empty { font-size: var(--fs-small); color: var(--faint); line-height: 1.5; }

    .history { padding: var(--sp-1) 0; margin-bottom: var(--sp-4); max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .history .section-title { margin: 14px 18px var(--sp-1); }
    .hist-row { padding: 13px 18px; border-top: 1px solid var(--hair); cursor: pointer; transition: background var(--dur-base) ease; }
    .hist-row:first-of-type { border-top: none; }
    .hist-row:active { background: var(--surface-2); }
    .hist-row.enter { animation: rowin .45s var(--ease-out); }
    @keyframes rowin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .hist-top { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
    .hist-top .date { color: var(--text); font-weight: 500; }
    .hist-top .amt { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--surface-2); padding: 3px 11px; border-radius: 999px; font-size: 14px; }
    .hist-note { font-size: 13px; color: var(--faint); margin-top: 5px; line-height: 1.35; }
    .hist-vitamins { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .hist-empty { padding: var(--sp-5); color: var(--faint); font-size: 14px; text-align: center; }

    /* ---- toast ---- */
    /* Anchored to the top: every primary action in this app sits at the bottom
       (the tap button, Undo / End Day, sheet buttons), and a bottom-anchored
       toast covered them — a long one wrapped to three lines right over
       End Day. Nothing important lives up here. */
    .toast {
      position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top));
      transform: translateX(-50%) translateY(-14px);
      background: var(--surface-2); color: var(--text);
      padding: 12px var(--sp-5); border-radius: 18px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity var(--dur-base), transform var(--dur-base) var(--ease-out);
      box-shadow: 0 12px 34px rgba(0,0,0,0.45); border: 1px solid var(--hair);
      z-index: 50; max-width: min(88%, 420px); text-align: center; line-height: 1.35;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- bottom sheet ---- */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center; z-index: 40;
      opacity: 0; pointer-events: none;
      transition: opacity var(--dur-base) ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--surface);
      border-radius: 26px 26px 0 0;
      padding: 14px 20px calc(26px + env(safe-area-inset-bottom));
      box-shadow: 0 -12px 50px rgba(0,0,0,0.5);
      overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
      max-height: 90vh; max-height: 90dvh;
      transform: translateY(100%);
      transition: transform var(--dur-panel) var(--ease-panel);
    }
    .overlay.show .sheet { transform: translateY(0); }
    .sheet::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 999px; background: var(--surface-2); margin: 0 auto var(--sp-4); }
    .sheet h3 { margin: 0 0 6px; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.3px; }
    .sheet p.sub { margin: 0 0 var(--sp-2); color: var(--muted); font-size: 14px; }
    .sheet label { display: block; font-size: 13px; color: var(--muted); margin: var(--sp-4) 0 6px; }
    .sheet input, .sheet textarea {
      width: 100%; max-width: 100%; min-width: 0; padding: 14px; font-size: 17px;
      border-radius: 12px; border: 1px solid var(--surface-2);
      background: var(--bg); color: var(--text);
      font-family: inherit; font-variant-numeric: tabular-nums;
      transition: border-color var(--dur-base) ease;
    }
    .sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--accent); }
    .sheet textarea { resize: none; font-variant-numeric: normal; }
    /* iOS renders time/date pickers with an intrinsic width that overflows
       the sheet; reset their native appearance so they honour width:100%. */
    .sheet input[type="time"], .sheet input[type="datetime-local"], .sheet input[type="date"] {
      -webkit-appearance: none; appearance: none;
      display: block; text-align: left;
    }
    .sheet input[type="time"]::-webkit-date-and-time-value,
    .sheet input[type="datetime-local"]::-webkit-date-and-time-value,
    .sheet input[type="date"]::-webkit-date-and-time-value {
      text-align: left; margin: 0;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
    .toggle-row span { font-size: 16px; }
    .switch { position: relative; width: 52px; height: 31px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--surface-2); border-radius: 999px; transition: var(--dur-base); }
    .slider:before { content: ""; position: absolute; height: 27px; width: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: var(--dur-base); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .switch input:checked + .slider { background: var(--safe); }
    .switch input:checked + .slider:before { transform: translateX(21px); }
    .sheet-btn {
      display: block; width: 100%; padding: var(--sp-4); margin-top: var(--sp-3);
      border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
      background: var(--surface-2); color: var(--text);
      transition: transform var(--dur-fast) ease, filter var(--dur-base) ease;
    }
    .sheet-btn:active { transform: scale(0.985); filter: brightness(0.92); }
    .sheet-btn.primary { background: var(--accent); color: var(--btn-text); }
    .sheet-btn.danger { background: transparent; color: var(--over); }
    .sheet-btn.ghost { background: transparent; color: var(--muted); }
    .sheet-btn.link { background: transparent; color: var(--accent); margin-top: 6px; }
    .sheet-divider { height: 1px; background: var(--hair); margin: 18px 0 2px; border: none; }
    /* icon buttons + settings menu rows */
    .sheet-btn.with-ico { display: flex; align-items: center; gap: var(--sp-3); text-align: left; padding: var(--sp-4); }
    .btn-ico { display: flex; align-items: center; justify-content: center; flex: none; color: var(--muted); }
    .sheet-btn.with-ico .btn-label { flex: 1; }
    .sheet-btn.with-ico .btn-chev { color: var(--faint); font-size: 20px; line-height: 1; flex: none; }
    .sheet-btn.with-ico:active .btn-ico { color: var(--accent); }
    /* settings section header */
    /* visually hidden, still announced by screen readers */
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    /* accessibility: stop double-tap zoom on controls, keep pinch-zoom; visible focus */
    button, .ring-wrap, .range-chip, .cal-day, .wk-bar, .tod-bar, .mg-face, .gg-face, .chip, .mood-btn { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    /* theme picker (settings) */
    .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; margin-top: var(--sp-2); }
    .theme-swatch { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 0; }
    .theme-dot {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--sw-bg) 0 50%, var(--sw-accent) 50% 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
      transition: transform var(--dur-fast) ease;
    }
    .theme-swatch:active .theme-dot { transform: scale(0.9); }
    .theme-swatch.on .theme-dot { box-shadow: 0 0 0 2.5px var(--accent), inset 0 0 0 1px rgba(255,255,255,0.16); }
    .theme-name { font-size: 11px; font-weight: 600; color: var(--muted); }
    .theme-swatch.on .theme-name { color: var(--text); }
    .theme-swatch:disabled { opacity: 0.5; cursor: default; }
    .theme-swatch:disabled:active .theme-dot { transform: none; }

    /* ---- insights panel ---- */
    .panel-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center; z-index: 25;
      opacity: 0; pointer-events: none; transition: opacity var(--dur-base) ease;
    }
    .panel-overlay.show { opacity: 1; pointer-events: auto; }
    .panel {
      width: 100%; max-width: 480px; background: var(--bg);
      border-radius: 26px 26px 0 0; max-height: 92vh;
      display: flex; flex-direction: column;
      box-shadow: 0 -12px 50px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform var(--dur-panel) var(--ease-panel);
    }
    .panel-overlay.show .panel { transform: translateY(0); }
    .panel::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 999px; background: var(--surface-2); margin: 10px auto 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px var(--sp-2); }
    .panel-head h3 { margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.4px; }
    .panel-close { background: none; border: none; color: var(--accent); font-size: 16px; font-weight: 700; cursor: pointer; padding: 6px var(--sp-1); }
    .panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px var(--sp-4) calc(20px + env(safe-area-inset-bottom)); }
    .panel-body .history { max-height: none; }
    /* range switcher */
    .range-row { display: flex; gap: 7px; margin-bottom: var(--sp-3); }
    .range-chip { flex: 1; border: none; cursor: pointer; background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 700; border-radius: 999px; padding: var(--sp-2) 0; box-shadow: var(--card-shadow); transition: background var(--dur-base) ease, color var(--dur-base) ease, transform var(--dur-fast) ease; }
    .range-chip:active { transform: scale(0.96); }
    .range-chip.on { background: var(--text); color: var(--bg); box-shadow: none; }
    /* on-pace line */
    .pace-line { font-size: 13px; color: var(--muted); text-align: center; margin: -var(--sp-1) 0 14px; line-height: 1.4; }
    .pace-line b { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .pace-line b.good { color: var(--safe); }
    .pace-line b.bad { color: var(--over); }
    /* this window against the one before it */
    .compare-line { font-size: 13px; color: var(--muted); text-align: center; margin: 0 var(--sp-4) 14px; line-height: 1.45; }
    .compare-line b { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .compare-line b.good { color: var(--safe); }
    .compare-line b.bad { color: var(--over); }
    /* today resembles days that have gone worse — a nudge, not an alarm */
    .risk-line {
      margin: 0 var(--sp-4) 14px; padding: var(--sp-3);
      background: var(--surface-2); border-radius: 12px;
      border-left: 3px solid var(--warn);
      font-size: var(--fs-small); color: var(--text); line-height: 1.45; text-align: left;
    }
    .risk-line b { color: var(--warn); }
    .risk-line .risk-sub { display: block; margin-top: 3px; font-size: var(--fs-micro); color: var(--muted); }
    /* trend line */
    .trend-svg { width: 100%; height: 84px; display: block; margin: var(--sp-3) 0 2px; overflow: visible; }
    .trend-poly { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .trend-goal { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; opacity: 0.7; }
    /* taper ladder */
    .ladder-svg { width: 100%; height: 76px; display: block; margin: var(--sp-3) 0 2px; overflow: visible; }
    .ladder-path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .ladder-zero { stroke: var(--safe); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; opacity: 0.8; }
    /* reaching-zero celebration */
    .win-card { text-align: center; background: var(--bg); border-radius: 18px; padding: var(--sp-6) var(--sp-5) var(--sp-5); margin: var(--sp-3) 0 var(--sp-2); box-shadow: inset 0 0 0 1.5px var(--safe); }
    .win-emoji { font-size: 54px; line-height: 1; }
    .win-big { font-size: var(--fs-hero); font-weight: 300; letter-spacing: -3px; line-height: 1; color: var(--safe); font-variant-numeric: tabular-nums; margin-top: var(--sp-2); }
    .win-cap { font-size: var(--fs-small); font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); margin-top: var(--sp-2); }
    /* step-down offer */
    .taper-card { display: flex; align-items: center; justify-content: center; gap: var(--sp-5); background: var(--bg); border-radius: 16px; padding: var(--sp-5); margin: var(--sp-3) 0 var(--sp-1); box-shadow: inset 0 0 0 1px var(--surface-2); }
    .taper-from { font-size: 34px; font-weight: 300; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .taper-arrow { font-size: 22px; color: var(--faint); }
    .taper-to { font-size: var(--fs-display); font-weight: 300; color: var(--safe); font-variant-numeric: tabular-nums; letter-spacing: -1.5px; }
    /* year heatmap */
    .year-grid { display: grid; grid-template-columns: repeat(53, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 2px; margin-top: var(--sp-2); }
    .year-cell { width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; background: var(--surface-2); }
    .year-cell.under { background: var(--safe); }
    .year-cell.over { background: var(--over); }
    .year-cell.logged { background: var(--accent-dim); }
    .year-cell.empty { background: var(--surface-2); opacity: 0.5; }
    .year-cell.future { background: transparent; }
    .year-cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tile { background: var(--surface); border-radius: 16px; padding: var(--sp-4) var(--sp-3); box-shadow: var(--card-shadow); }
    .tile-val { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .tile-val.good { color: var(--safe); }
    .tile-val.bad { color: var(--over); }
    .tile-lbl { font-size: 12px; color: var(--muted); margin-top: 5px; font-weight: 500; }
    .tile-delta { font-size: 11px; font-weight: 700; margin-top: 6px; }
    .tile-delta.down { color: var(--safe); }
    .tile-delta.up { color: var(--over); }
    .tile-delta.flat { color: var(--muted); }

    /* ---- today's tap timeline (insights) ---- */
    .tap-list { display: flex; flex-direction: column; }
    .tap-row {
      display: flex; align-items: center; gap: var(--sp-3);
      padding: 9px 2px; border-top: 1px solid var(--hair);
      font-size: 14px; font-variant-numeric: tabular-nums;
    }
    .tap-row:first-child { border-top: none; }
    .tap-row .tap-t { color: var(--muted); flex: 1; }
    .tap-row .tap-amt { color: var(--accent); font-weight: 700; }
    .tap-row .tap-amt.neg { color: var(--muted); }
    .tap-row .tap-total {
      font-weight: 700; color: var(--muted); background: var(--surface-2);
      padding: 3px 11px; border-radius: 999px; font-size: 13px; min-width: 44px; text-align: center;
    }
    .tap-row.tap-editable { cursor: pointer; margin: 0 -6px; padding-left: var(--sp-2); padding-right: var(--sp-2); border-radius: 8px; transition: background var(--dur-fast) ease; }
    .tap-row.tap-editable:active { background: var(--surface-2); }
    .tap-row.tap-editable .tap-t::after { content: " ✎"; color: var(--faint); font-size: 11px; }
    .tap-hint { font-size: 11px; color: var(--faint); margin: -var(--sp-1) 2px var(--sp-2); }
    .tap-empty { font-size: 13px; color: var(--faint); }
    .tap-scroll { max-height: 34vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 2px; }

    /* ---- end day: mood, factors, tiny wins, worry dump ---- */
    .mood-row { display: flex; gap: 7px; }
    .mood-btn {
      flex: 1; padding: 11px 0 var(--sp-2); border-radius: 14px; border: none;
      background: var(--bg); color: var(--text); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);
      box-shadow: inset 0 0 0 1px var(--surface-2);
      transition: transform var(--dur-fast) ease, box-shadow var(--dur-base) ease, background var(--dur-base) ease;
    }
    .mood-btn .mood-emoji { font-size: 23px; line-height: 1; filter: saturate(0.85); transition: filter var(--dur-base) ease; }
    .mood-btn .mood-cap { font-size: 10px; color: var(--muted); font-weight: 600; }
    .mood-btn:active { transform: scale(0.93); }
    .mood-btn.on { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--accent); }
    .mood-btn.on .mood-emoji { filter: saturate(1.1); }
    .mood-btn.on .mood-cap { color: var(--accent); }

    .chip-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
      border-radius: 999px; border: none; background: var(--bg); color: var(--text);
      font-size: 14px; font-weight: 600; cursor: pointer;
      box-shadow: inset 0 0 0 1px var(--surface-2);
      transition: transform var(--dur-fast) ease, box-shadow var(--dur-base) ease, background var(--dur-base) ease;
    }
    .chip .chip-emoji { font-size: 15px; }
    .chip:active { transform: scale(0.95); }
    .chip.on { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--accent); }

    .win-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
    .win-row .win-n { color: var(--faint); font-size: 15px; font-weight: 700; width: 12px; text-align: center; flex: none; }
    .win-row input { margin: 0; }

    /* add missed taps (End Day) */
    .tap-adder { background: var(--bg); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 0 1px var(--surface-2); }
    .tap-adder-total { font-size: 34px; font-weight: 300; letter-spacing: -1px; text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
    .tap-adder-btns { display: flex; gap: var(--sp-2); margin-top: 13px; }
    .tap-adder-btn { flex: 1; padding: 11px; border-radius: 10px; border: none; cursor: pointer; font-size: 15px; font-weight: 700; background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums; transition: transform var(--dur-fast) ease; }
    .tap-adder-btn:active { transform: scale(0.96); }
    .tap-adder-btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--surface-2); color: var(--muted); }
    .tap-adder-custom { display: flex; gap: var(--sp-2); align-items: center; margin-top: 10px; }
    .tap-adder-custom input { margin: 0; }
    .tap-adder-custom .sheet-btn { width: auto; margin: 0; padding: var(--sp-3) 18px; flex: none; }

    .worry-open {
      width: 100%; text-align: left; border: none; cursor: pointer; margin-top: 6px;
      background: var(--bg); color: var(--text); border-radius: 12px; padding: 14px;
      box-shadow: inset 0 0 0 1px var(--surface-2);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      transition: transform var(--dur-fast) ease;
    }
    .worry-open:active { transform: scale(0.99); }
    .worry-open .worry-ttl { font-size: 15px; font-weight: 700; }
    .worry-open .worry-sub { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 3px; }
    .worry-open .worry-arrow { color: var(--accent); font-size: 20px; flex: none; }

    /* worry dump flow */
    .worry-timer { font-size: var(--fs-display); font-weight: 300; letter-spacing: -1px; text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); margin: 6px 0 0; }
    .worry-timer.done { color: var(--muted); }
    .worry-timer-sub { text-align: center; font-size: 12px; color: var(--faint); margin: 2px 0 var(--sp-1); }
    .worry-item { padding: 13px 0; border-top: 1px solid var(--hair); }
    .worry-item:first-child { border-top: none; }
    .worry-item .worry-text { font-size: 15px; margin-bottom: 9px; line-height: 1.35; }
    .ctl-row { display: flex; gap: var(--sp-2); }
    .ctl-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; background: var(--bg); color: var(--muted); box-shadow: inset 0 0 0 1px var(--surface-2); transition: transform var(--dur-fast) ease, box-shadow var(--dur-base) ease, color var(--dur-base) ease; }
    .ctl-btn:active { transform: scale(0.96); }
    .ctl-btn.in.on { color: var(--safe); box-shadow: inset 0 0 0 2px var(--safe); }
    .ctl-btn.out.on { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--muted); }
    .worry-let-go { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .worry-lg-item { padding: 9px 0; border-top: 1px solid var(--hair); }
    .worry-lg-item:first-child { border-top: none; }
    .worry-action-lbl { font-size: 15px; line-height: 1.35; margin: 14px 0 6px; }
    .worry-action-lbl .wa-tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--safe); margin-bottom: 3px; }

    /* ---- insights: mood & patterns + tiny wins ---- */
    .mood-head { display: flex; align-items: center; gap: 13px; margin-bottom: 2px; }
    .mood-head .mood-avg-emoji { font-size: 34px; line-height: 1; }
    .mood-head .mood-avg-val { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .mood-head .mood-avg-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .mood-spark { display: flex; align-items: flex-end; gap: 3px; height: 42px; margin: 14px 0 2px; }
    .mood-spark .ms-bar { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--accent); opacity: 0.85; min-height: 3px; transition: height var(--dur-slow) var(--ease-out); }
    .mood-spark .ms-bar.empty { background: var(--surface-2); opacity: 1; }
    .mood-corr { font-size: 13px; color: var(--muted); margin-top: 11px; line-height: 1.45; }
    .mood-corr b { color: var(--text); font-weight: 700; }
    .mood-corr .mc-up { color: var(--safe); font-weight: 700; }
    .mood-corr .mc-down { color: var(--over); font-weight: 700; }
    .mood-hint { font-size: 12px; color: var(--faint); margin-top: 10px; line-height: 1.4; }
    .win-item { display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-3) 2px; border-top: 1px solid var(--hair); font-size: 14px; line-height: 1.35; }
    .win-item:first-of-type { border-top: none; }
    .win-item .win-check { color: var(--safe); flex: none; font-weight: 700; }
    .win-item .win-day { color: var(--faint); font-size: 12px; margin-left: auto; flex: none; white-space: nowrap; }

    /* ---- history sheet recap (read-only mood/wins/worries) ---- */
    .day-recap { font-size: 14px; color: var(--muted); line-height: 1.55; margin-top: var(--sp-2); }
    .day-recap b { color: var(--text); font-weight: 700; }
    .day-recap .dr-mood-emoji { font-size: 22px; vertical-align: middle; margin-right: 6px; }
    .day-recap .dr-list { margin: var(--sp-1) 0 0; padding-left: 18px; }
    .day-recap .dr-list li { margin: 3px 0; }

    /* ---- time since cards ---- */
    .since-card { background: var(--surface); border-radius: 18px; padding: var(--sp-4); margin-bottom: var(--sp-3); box-shadow: var(--card-shadow); cursor: pointer; transition: transform var(--dur-fast) ease; overflow: hidden; }
    .since-card:active { transform: scale(0.99); }
    .since-name { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
    .since-big { font-size: var(--fs-display); font-weight: 300; letter-spacing: -1.5px; line-height: 1.1; margin-top: 6px; color: var(--accent); }
    .since-big .since-unit { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: var(--sp-2); letter-spacing: 0; }
    .since-detail { font-size: 13px; color: var(--muted); margin-top: var(--sp-1); font-variant-numeric: tabular-nums; }
    .since-start { font-size: 12px; color: var(--faint); margin-top: var(--sp-2); }
    .since-empty { color: var(--faint); font-size: 14px; text-align: center; padding: 24px 10px; line-height: 1.5; }
    .since-prog { margin-top: 14px; }
    .since-prog-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .since-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .since-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width var(--dur-slow) var(--ease-out); }
    .since-stats { font-size: 12px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
    .since-stats b { color: var(--text); font-weight: 700; }
    .since-note { margin-top: 10px; font-size: 13px; color: var(--muted); font-style: italic; line-height: 1.4; }
    .since-saved { margin-top: var(--sp-3); display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
    .since-saved-val { font-size: 22px; font-weight: 700; color: var(--safe); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .since-saved-sub { font-size: 12px; color: var(--muted); }
    .since-miles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-3); }
    .since-mile { font-size: 11px; font-weight: 700; padding: var(--sp-1) 9px; border-radius: 999px; background: var(--surface-2); color: var(--faint); }
    .since-mile.reached { background: rgba(255,149,0,0.16); color: var(--accent); }
    .since-mile.next { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
    /* private "why you reset" journal on each tracker card */
    .since-log-title { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--faint); margin-top: 15px; }
    .since-log { margin-top: 6px; }
    .since-log-row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 13px; line-height: 1.45; }
    .since-log-row:first-child { border-top: none; }
    .since-log-date { color: var(--faint); font-size: 12px; flex: none; min-width: 44px; font-variant-numeric: tabular-nums; }
    .since-log-reason { color: var(--muted); overflow-wrap: anywhere; }
    /* urge-resisted + ride-it-out */
    .urge-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: var(--sp-3); flex-wrap: wrap; }
    .urge-count { font-size: 13px; font-weight: 700; color: var(--muted); }
    .urge-btn { border: none; cursor: pointer; background: var(--surface-2); color: var(--accent); font-size: 13px; font-weight: 700; border-radius: 999px; padding: var(--sp-2) 15px; transition: transform var(--dur-fast) ease; }
    .urge-btn:active { transform: scale(0.96); }
    .craving-clock { font-size: var(--fs-display); font-weight: 300; letter-spacing: -2px; text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); margin: var(--sp-2) 0 2px; }
    .craving-line { text-align: center; font-size: 14px; color: var(--muted); min-height: 20px; }
    /* weekly recap */
    .recap { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 var(--sp-1); }
    .recap-row { display: flex; align-items: center; gap: 13px; padding: 11px 2px; border-top: 1px solid var(--hair); }
    .recap-row:first-child { border-top: none; }
    .recap-ico { font-size: 22px; flex: none; width: 26px; text-align: center; }
    .recap-body { flex: 1; min-width: 0; }
    .recap-val { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .recap-lbl { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* recovery timeline */
    .rec-title { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); margin-top: 15px; }
    .rec { position: relative; margin-top: 10px; }
    .rec::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 12px; width: 2px; background: var(--hair); }
    .rec-row { display: flex; gap: 13px; padding: 5px 0; align-items: flex-start; position: relative; }
    .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-2); flex: none; margin-top: 3px; box-shadow: 0 0 0 3px var(--surface); z-index: 1; }
    .rec-row.reached .rec-dot { background: var(--safe); }
    .rec-row.next .rec-dot { background: var(--bg); box-shadow: inset 0 0 0 2.5px var(--accent), 0 0 0 3px var(--surface); }
    .rec-body { flex: 1; min-width: 0; }
    .rec-head { display: flex; align-items: baseline; gap: 7px; }
    .rec-icon { font-size: 14px; flex: none; }
    .rec-row.future .rec-icon { opacity: 0.4; }
    .rec-label { font-size: 13px; font-weight: 700; color: var(--text); }
    .rec-when { font-size: 11px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .rec-text { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
    .rec-row.future .rec-label { color: var(--faint); }
    .rec-row.future .rec-text { color: var(--faint); }
    .rec-row.next .rec-label { color: var(--accent); }

    /* don't-break-the-chain clean-days grid */
    .chain-title { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); margin-top: 15px; }
    .chain-grid { display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 3px; margin-top: var(--sp-2); }
    .chain-cell { width: 100%; aspect-ratio: 1 / 1; border-radius: 3px; background: var(--surface-2); }
    .chain-cell.clean { background: var(--safe); }
    .chain-cell.slip { background: var(--over); }
    .chain-cell.pre { background: var(--surface-2); opacity: 0.35; }
    .chain-cell.future { background: transparent; box-shadow: inset 0 0 0 1px var(--hair); }
    .chain-cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .chain-cap { font-size: 12px; color: var(--muted); margin-top: var(--sp-2); font-variant-numeric: tabular-nums; }
    .chain-cap b { color: var(--text); font-weight: 700; }

    .since-log-locked { display: block; width: 100%; text-align: left; border: none; cursor: pointer; margin-top: var(--sp-2); background: var(--surface-2); color: var(--muted); border-radius: 10px; padding: var(--sp-3) 14px; font-size: 13px; font-weight: 600; transition: filter var(--dur-fast) ease; }
    .since-log-locked:active { filter: brightness(0.94); }
    .since-log-body { display: flex; flex-direction: column; gap: 3px; }
    .since-log-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .since-log-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--surface-2); border-radius: 999px; padding: 2px var(--sp-2); }
    .since-log-cope { color: var(--faint); font-size: 12px; font-style: italic; }
    /* slip patterns */
    .pat { margin-top: 10px; background: var(--surface-2); border-radius: 12px; padding: 11px 13px; }
    .pat-line { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .pat-line.good { color: var(--safe); font-weight: 700; }
    /* pause-before-reset card */
    .pause-card { background: var(--bg); border-radius: 16px; padding: var(--sp-4); box-shadow: inset 0 0 0 1px var(--surface-2); margin: var(--sp-1) 0 var(--sp-2); text-align: center; }
    .pause-name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
    .pause-run { font-size: 30px; font-weight: 300; letter-spacing: -1px; color: var(--accent); margin: var(--sp-1) 0 var(--sp-2); font-variant-numeric: tabular-nums; }
    .pause-line { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .pause-why { background: var(--bg); border-radius: 12px; padding: var(--sp-3) 14px; box-shadow: inset 0 0 0 1px var(--surface-2); margin-top: 10px; }
    .pause-why-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent); margin-bottom: var(--sp-1); }
    .pause-why-text { font-size: 14px; color: var(--text); line-height: 1.45; }
    /* breathing orb */
    .breath-wrap { display: flex; align-items: center; justify-content: center; height: 210px; margin: 6px 0 2px; }
    .breath-orb { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, var(--accent-2), var(--accent)); transform: scale(0.55); transition: transform 4s ease-in-out; box-shadow: 0 0 46px 6px var(--btn-glow, rgba(255,149,0,0.35)); }
    .breath-orb.in   { transform: scale(1);    transition-duration: 4s; }
    .breath-orb.hold { transform: scale(1);    transition-duration: 4s; }
    .breath-orb.out  { transform: scale(0.55); transition-duration: 6s; }

    /* ---- water tracker (separate panel) ---- */
    .water-card { background: var(--surface); border-radius: 22px; box-shadow: var(--card-shadow); padding: 24px 18px 20px; text-align: center; margin-bottom: 14px; }
    .water-big { font-size: var(--fs-display); font-weight: 300; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--water); }
    .water-big.bump { animation: bump 0.22s ease; }
    .water-big .water-unit { font-size: 22px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
    .water-goal { font-size: 14px; color: var(--muted); margin-top: var(--sp-3); }
    .water-goal.done { color: var(--water); font-weight: 700; }
    .water-bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: var(--sp-4); }
    .water-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--water-2), var(--water)); transition: width var(--dur-slow) var(--ease-out); }
    .water-add {
      width: 100%; border: none; border-radius: 20px; padding: 20px; margin-top: 2px;
      background: linear-gradient(180deg, var(--water-2), var(--water)); color: #fff;
      font-size: 22px; font-weight: 700; cursor: pointer; letter-spacing: 0.2px;
      box-shadow: 0 10px 26px rgba(10,132,255,0.34), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform var(--dur-fast) ease;
    }
    .water-add:active { transform: scale(0.98) translateY(1px); }
    .water-row { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); }
    .water-row button { flex: 1; padding: 14px; border: none; border-radius: 14px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: var(--card-shadow); transition: background var(--dur-base) ease, transform var(--dur-fast) ease; }
    .water-row button:active { background: var(--surface-2); transform: scale(0.98); }
    .water-row button:disabled { opacity: 0.35; box-shadow: none; }
    .water-section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; color: var(--muted); margin: var(--sp-5) 2px 10px; }
    .water-presets { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .water-preset { flex: none; padding: 9px 15px; border-radius: 999px; border: none; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: var(--card-shadow); font-variant-numeric: tabular-nums; transition: transform var(--dur-fast) ease; }
    .water-preset:active { transform: scale(0.94); }
    .water-preset.on { background: var(--water); color: #fff; box-shadow: none; }
    .water-preset.add { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hair); color: var(--muted); font-size: 18px; padding: var(--sp-2) var(--sp-4); }
    .water-presets.manage { margin: var(--sp-1) 0 2px; }
    .water-mchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 9px 10px 9px 14px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .water-mchip-x { background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .water-mchip-x:active { color: var(--over); }
    .water-stat { font-size: 13px; color: var(--muted); margin-top: var(--sp-4); text-align: center; }
    .water-stat b { color: var(--text); font-weight: 700; }

    /* ---- growth tree ---- */
    .tree-scene { position: relative; display: flex; align-items: flex-end; justify-content: center; height: 234px; margin: var(--sp-2) 0 2px; }
    .tree-svg { width: 260px; max-width: 82%; height: auto; overflow: visible; animation: treeRise 0.6s var(--ease-out); }
    .tree-ground { fill: var(--surface-2); }
    .tree-trunk { fill: #8a5a3c; transition: fill var(--dur-slow) ease; }
    .canopy { transform-box: fill-box; transform-origin: center bottom; }
    .canopy circle { fill: #43b078; transition: fill var(--dur-slow) ease; }
    .canopy .hl { fill: #6bd7a0; }
    .tree-top { transform-box: fill-box; transform-origin: bottom center; animation: treeSway 5.5s ease-in-out infinite; }
    .tree-scene.grew .canopy { animation: treeGrow 0.75s var(--ease-out); }

    /* sad: droop + wither */
    .tree-scene.sad .tree-top { animation: none; transform: rotate(3deg); }
    .tree-scene.sad .canopy { transform: translateY(7px) scaleY(0.9); transition: transform var(--dur-slow) ease; }
    .tree-scene.sad .canopy circle { fill: #9c8f5c; }
    .tree-scene.sad .canopy .hl { fill: #b3a76c; }
    .tree-scene.sad .tree-trunk { fill: #6f4a31; }

    /* prestige: glow burst + pop + sparkles */
    .tree-scene.prestige::before {
      content: ""; position: absolute; left: 50%; top: 44%; width: 160px; height: 160px;
      transform: translate(-50%,-50%); border-radius: 50%;
      background: radial-gradient(circle, rgba(76,195,138,0.55), transparent 70%);
      animation: treeBurst 1s ease-out; pointer-events: none;
    }
    .tree-scene.prestige .tree-svg { animation: treePop 0.85s var(--ease-out); }
    .tree-sparkles { position: absolute; left: 50%; top: 44%; pointer-events: none; }
    .tree-sparkles span { position: absolute; width: 9px; height: 9px; margin: -var(--sp-1); border-radius: 50%; background: var(--accent); animation: sparkle 1s ease-out forwards; }

    @keyframes treeSway { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes treeRise { from { opacity: 0.25; transform: translateY(10px) scale(0.93); } to { opacity: 1; transform: none; } }
    @keyframes treeGrow { 0% { transform: scale(0.82); } 55% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes treeBurst { from { opacity: 0.85; transform: translate(-50%,-50%) scale(0.3); } to { opacity: 0; transform: translate(-50%,-50%) scale(2.3); } }
    @keyframes treePop { 0% { transform: scale(0.6); } 60% { transform: scale(1.13); } 100% { transform: scale(1); } }
    @keyframes sparkle { from { transform: rotate(var(--a)) translateY(0); opacity: 1; } to { transform: rotate(var(--a)) translateY(-94px); opacity: 0; } }

    .tree-level { text-align: center; font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; }
    .tree-level b { color: var(--accent); }
    .tree-caption { text-align: center; font-size: 14px; color: var(--muted); margin: 10px 6px 0; line-height: 1.45; }
    .tree-prog { margin: 18px 2px 0; }
    .tree-prog-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .tree-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .tree-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6bd7a0, #43b078); transition: width var(--dur-slow) var(--ease-out); }
    .tree-note { font-size: 12px; color: var(--faint); text-align: center; margin: 18px var(--sp-2) 0; line-height: 1.5; }

    /* ---- daily reminder banner ---- */
    .reminder {
      display: flex; align-items: center; gap: 10px;
      margin: 6px 0 2px; padding: 11px 14px;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 14px; font-size: 14px; font-weight: 600; color: var(--text);
      box-shadow: var(--card-shadow); overflow: hidden;
    }
    .reminder span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reminder-x { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: var(--sp-1) 2px; }

    /* ---- compact "time since" strip on the main page ---- */
    .since-strip { display: flex; gap: var(--sp-2); overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 6px 0 2px; padding-bottom: 2px; scrollbar-width: none; }
    .since-strip::-webkit-scrollbar { display: none; }
    .ss-chip {
      flex: none; display: flex; align-items: center; gap: var(--sp-2);
      background: var(--surface); border: 1px solid var(--hair);
      border-radius: 999px; padding: var(--sp-2) 14px; cursor: pointer;
      box-shadow: var(--card-shadow); transition: transform var(--dur-fast) ease;
    }
    .ss-chip:active { transform: scale(0.96); }
    .ss-chip svg { color: var(--muted); flex: none; }
    .ss-name { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ss-val { font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

    /* ---- calendar heatmap + weekday bars (insights) ---- */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
    .cal-nav .section-title { margin: 0; }
    .cal-nav-btn {
      background: var(--surface-2); border: none; color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity var(--dur-base) ease, transform var(--dur-fast) ease;
    }
    .cal-nav-btn:active { transform: scale(0.9); }
    .cal-nav-btn:disabled { opacity: 0.28; cursor: default; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-head { font-size: 10px; font-weight: 700; color: var(--faint); text-align: center; padding-bottom: 2px; }
    .cal-day {
      aspect-ratio: 1 / 1; border-radius: 7px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--muted);
    }
    .cal-day.blank { background: transparent; }
    .cal-day.empty { background: transparent; color: var(--faint); }
    .cal-day.logged { background: var(--accent-dim); color: #fff; }
    .cal-day.under { background: var(--safe); color: #04210d; }
    .cal-day.over { background: var(--over); color: #2b0707; }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-day:not(.blank) { cursor: pointer; transition: transform var(--dur-fast) ease; }
    .cal-day:not(.blank):active { transform: scale(0.9); }
    .cal-day.sel { box-shadow: inset 0 0 0 2px var(--text); }
    .cal-day.today.sel { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 2px var(--text); }
    .cal-detail { font-size: 13px; color: var(--muted); margin-top: var(--sp-3); min-height: 18px; text-align: center; }
    .cal-detail b { color: var(--text); font-weight: 700; }
    .cal-note { font-size: 12px; color: var(--faint); font-style: italic; margin-top: 3px; }
    .hist-more {
      display: block; width: 100%; margin-top: var(--sp-2);
      background: none; border: 1px dashed var(--hair); border-radius: 12px;
      color: var(--accent); font-size: var(--fs-small); font-weight: 600;
      padding: var(--sp-3); cursor: pointer; font-family: inherit; text-align: center;
      transition: background var(--dur-fast) var(--ease-out);
    }
    .hist-more:active { background: var(--key); }
    /* ---- data health findings ---- */
    .health-row {
      background: var(--surface-2); border-radius: 12px;
      padding: var(--sp-3); margin-top: var(--sp-2);
    }
    .health-title { font-size: var(--fs-small); font-weight: 700; color: var(--text); }
    .health-detail { font-size: var(--fs-micro); color: var(--muted); margin-top: 2px; }
    .health-dates { font-size: var(--fs-micro); color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .health-fix {
      margin-top: var(--sp-2); background: var(--key); border: none; border-radius: 9px;
      color: var(--accent); font-size: var(--fs-micro); font-weight: 700;
      padding: 7px 13px; cursor: pointer; font-family: inherit;
    }
    .health-fix:active { background: var(--key-press); }
    /* numbered steps in the reminder guide */
    .guide-steps { margin: var(--sp-2) 0 var(--sp-3); padding-left: 20px; }
    .guide-steps li { font-size: var(--fs-small); color: var(--muted); line-height: 1.5; margin-bottom: 6px; }
    .cal-edit {
      margin-top: var(--sp-2); background: var(--key); border: none; border-radius: 8px;
      color: var(--accent); font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.02em;
      padding: 6px 12px; cursor: pointer; font-family: inherit;
      transition: background var(--dur-fast) var(--ease-out);
    }
    .cal-edit:active { background: var(--key-press); }

    /* ---- if-then plans (inside the private journal) ---- */
    .plan-title { font-size: var(--fs-small); font-weight: 700; color: var(--text); margin-top: var(--sp-4); }
    .plan-sub { font-size: var(--fs-micro); color: var(--faint); margin-top: 2px; }
    .plan-list { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-3); }
    .plan-row {
      display: flex; align-items: flex-start; gap: var(--sp-2);
      background: var(--surface-2); border-radius: 12px; padding: var(--sp-3);
    }
    .plan-body { flex: 1; min-width: 0; }
    button.plan-body {
      background: none; border: none; padding: 0; text-align: left;
      font-family: inherit; cursor: pointer; color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button.plan-body:active { opacity: .7; }
    .plan-cue { font-size: var(--fs-micro); color: var(--muted); }
    .plan-action { font-size: var(--fs-small); color: var(--text); font-weight: 600; margin-top: 2px; }
    .plan-del {
      background: none; border: none; color: var(--faint); font-size: 20px; line-height: 1;
      padding: 0 2px; cursor: pointer; font-family: inherit;
    }
    .plan-del:active { color: var(--over); }
    .plan-add {
      display: block; width: 100%; margin-top: var(--sp-2);
      background: none; border: 1px dashed var(--hair); border-radius: 12px;
      color: var(--accent); font-size: var(--fs-small); font-weight: 600;
      padding: var(--sp-3); cursor: pointer; font-family: inherit; text-align: center;
      transition: background var(--dur-fast) var(--ease-out);
    }
    .plan-add:active { background: var(--key); }

    .vit-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
    .vit-header h3 { margin: 0; }
    .vit-summary {
      font-size: 13px; font-weight: 600; color: var(--muted);
      background: var(--surface-2); border-radius: 99px; padding: 3px 10px;
    }
    .vit-summary.all-done { color: var(--safe); }
    .vit-bar { height: 3px; border-radius: 99px; background: var(--surface-2); margin-bottom: var(--sp-3); overflow: hidden; }
    .vit-bar i { display: block; height: 100%; border-radius: 99px; background: var(--safe); transition: width var(--dur-slow) var(--ease-out); }
    .vit-list { display: flex; flex-direction: column; }
    .vit-row {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 0; border-bottom: 1px solid var(--surface-2);
      transition: opacity var(--dur-fast) ease;
    }
    .vit-row:last-child, .vit-row:has(+ .vit-add-row) { border-bottom: none; }
    .vit-circle {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--surface-2); position: relative;
      transition: border-color var(--dur-base) ease, background var(--dur-base) ease;
      pointer-events: none;
    }
    .vit-row.taken .vit-circle {
      border-color: var(--safe); background: var(--safe);
    }
    .vit-circle::after {
      content: ""; position: absolute; left: 5px; top: 2px;
      width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg); opacity: 0; transition: opacity var(--dur-fast) ease;
    }
    .vit-row.taken .vit-circle::after { opacity: 1; }
    .vit-body {
      flex: 1; min-width: 0; background: none; border: none; padding: 0;
      text-align: left; font-family: inherit; cursor: pointer; color: inherit;
      -webkit-tap-highlight-color: transparent; display: flex; align-items: baseline; gap: 8px;
    }
    .vit-body:active { opacity: .7; }
    .vit-name { font-size: 15px; color: var(--text); font-weight: 500; }
